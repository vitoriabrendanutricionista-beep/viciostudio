<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VDE Studio — produção de conteúdo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== tokens ===== */
:root{
  --ink:#2b1055; --ink-soft:#3a1a6e; --ink-line:rgba(255,255,255,.14);
  --side-grad:linear-gradient(168deg,#2b1055 0%,#45198c 42%,#6d28d9 100%);
  --canvas:#f5f1fc; --surface:#ffffff; --surface-2:#faf7fe; --surface-3:#f3edfd;
  --line:#e4daf4; --line-soft:#eee7f9;
  --text:#291a3f; --text-2:#6b5a85; --text-3:#9c8db4;
  --accent:#7c3aed; --accent-2:#a855f7; --accent-ink:#ffffff;
  --accent-grad:linear-gradient(135deg,#8b5cf6 0%,#7c3aed 55%,#6d28d9 100%);
  --accent-soft:#f1e9fe;
  --teal:#6d28d9; --plum:#7c3aed; --grass:#8b5cf6; --gold:#9333ea; --rose:#db2777;
  --on-dark:#f6f1fd; --on-dark-2:#c3b1e4;
  --r-lg:16px; --r:12px; --r-s:9px; --r-xs:6px;
  --sp:16px;
  --sh-1:0 1px 2px rgba(41,26,63,.05);
  --sh-2:0 4px 14px rgba(41,26,63,.09);
  --shadow-pop:0 18px 48px rgba(28,12,54,.28);
  --grid:250px minmax(0,1fr);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#170e28; --ink-soft:#20142f; --ink-line:rgba(255,255,255,.1);
    --side-grad:linear-gradient(168deg,#140b22 0%,#26113f 45%,#3b1d70 100%);
    --canvas:#120b1d; --surface:#1a1129; --surface-2:#211634; --surface-3:#281a40;
    --line:#332448; --line-soft:#2a1c3e;
    --text:#f0e9fa; --text-2:#b2a2c9; --text-3:#85759e;
    --accent:#8b5cf6; --accent-2:#a855f7; --accent-soft:#251640;
    --accent-grad:linear-gradient(135deg,#a855f7 0%,#8b5cf6 60%,#7c3aed 100%);
    --sh-1:0 1px 2px rgba(0,0,0,.3); --sh-2:0 4px 14px rgba(0,0,0,.35);
    --shadow-pop:0 18px 48px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ink:#170e28; --ink-soft:#20142f; --ink-line:rgba(255,255,255,.1);
  --side-grad:linear-gradient(168deg,#140b22 0%,#26113f 45%,#3b1d70 100%);
  --canvas:#120b1d; --surface:#1a1129; --surface-2:#211634; --surface-3:#281a40;
  --line:#332448; --line-soft:#2a1c3e;
  --text:#f0e9fa; --text-2:#b2a2c9; --text-3:#85759e;
  --accent:#8b5cf6; --accent-2:#a855f7; --accent-soft:#251640;
  --accent-grad:linear-gradient(135deg,#a855f7 0%,#8b5cf6 60%,#7c3aed 100%);
  --sh-1:0 1px 2px rgba(0,0,0,.3); --sh-2:0 4px 14px rgba(0,0,0,.35);
  --shadow-pop:0 18px 48px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  height:100%;margin:0;background:var(--canvas);color:var(--text);
  font-family:Poppins,"Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.brand,.colname,.kpi b{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;font-weight:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.hidden{display:none!important}

/* ===== estrutura ===== */
.app{display:grid;grid-template-columns:var(--grid);height:100%;min-height:0}
main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}

/* ===== barra lateral ===== */
aside{
  position:relative;background:var(--side-grad);color:var(--on-dark);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
}
aside::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 55% at 8% -8%,rgba(255,255,255,.18),transparent 60%);
}
aside>*{position:relative}
.brand{display:flex;align-items:center;gap:11px;padding:19px 18px 15px;min-width:0}
.mark{
  width:32px;height:32px;border-radius:10px;flex:0 0 auto;background:#fff;color:#6d28d9;
  display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.04em;
  box-shadow:0 3px 10px rgba(0,0,0,.18);
}
.brand>div{min-width:0}
.brand b{font-size:15.5px;font-weight:600;display:block;line-height:1.15;color:#fff}
.brand span{font-size:11.5px;color:var(--on-dark-2);display:block}
nav{padding:6px 11px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-height:0}
.navlabel{font-size:10px;color:var(--on-dark-2);padding:13px 8px 5px;letter-spacing:.1em;text-transform:uppercase}
.nav-i{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;
  color:var(--on-dark-2);font-size:13.5px;font-weight:500;text-align:left;width:100%;min-width:0;
  transition:background .15s,color .15s;
}
.nav-i:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-i[aria-current="true"]{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.nav-i .ic{width:18px;text-align:center;font-size:14px;flex:0 0 auto;opacity:.95}
.nav-i>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i .pill{
  flex:0 0 auto;font-size:11px;font-weight:600;color:#fff;background:rgba(255,255,255,.18);
  padding:1px 8px;border-radius:20px;font-variant-numeric:tabular-nums;
}
.side-foot{margin-top:auto;padding:13px;border-top:1px solid var(--ink-line);display:flex;flex-direction:column;gap:9px}
.who{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--on-dark-2);min-width:0}
.who img{width:26px;height:26px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.who>div{min-width:0}
.who b{color:#fff;font-weight:600;font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-actions{display:flex;gap:7px}
.ghost-d{
  flex:1;min-width:0;padding:8px;border-radius:9px;border:1px solid var(--ink-line);
  color:var(--on-dark-2);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(255,255,255,.04);
}
.ghost-d:hover{background:rgba(255,255,255,.14);color:#fff}

/* ===== topo ===== */
.topbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:0 0 auto;
  padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-top:calc(12px + env(safe-area-inset-top,0px));
}
.burger{display:none;flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);align-items:center;justify-content:center;font-size:15px}
.vt{flex:1 1 160px;min-width:0}
.vt h1{margin:0;font-size:17px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt p{margin:1px 0 0;font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{
  display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;padding:0 11px;height:36px;width:230px;flex:0 0 auto;min-width:0;
}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:none;outline:none;width:100%;min-width:0;font-size:13px}
.search>span{color:var(--text-3);font-size:14px;flex:0 0 auto}
.psel{width:164px;flex:0 0 auto}
.btn{
  height:36px;padding:0 15px;border-radius:10px;background:var(--accent-grad);color:var(--accent-ink);
  font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  white-space:nowrap;flex:0 0 auto;box-shadow:var(--sh-1);transition:filter .15s,transform .05s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surface-2);color:var(--text);border:1px solid var(--line);font-weight:500;box-shadow:none}
.btn.sec:hover{background:var(--surface-3);filter:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.icon{padding:0;width:36px}

/* ===== filtros ativos ===== */
.filterbar{
  display:flex;align-items:center;gap:7px;padding:10px 20px;flex-wrap:wrap;flex:0 0 auto;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.filterbar:empty{display:none}
.fchip{
  display:inline-flex;align-items:center;gap:6px;max-width:100%;font-size:12px;padding:3px 5px 3px 10px;
  border-radius:20px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);
}
.fchip b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip button{flex:0 0 auto;width:17px;height:17px;border-radius:50%;color:var(--text-3);font-size:13px;line-height:1}
.fchip button:hover{background:var(--line);color:var(--text)}
.fclear{font-size:12px;color:var(--accent);font-weight:600;padding:3px 6px}
.banner{
  display:flex;gap:9px;align-items:center;flex:0 0 auto;padding:9px 20px;font-size:12.5px;
  background:var(--accent-soft);color:var(--text);border-bottom:1px solid var(--line);
}

/* ===== área principal ===== */
.view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:20px;-webkit-overflow-scrolling:touch}
.view.kanban{padding:0;overflow:hidden}

/* ===== kanban ===== */
.board{display:flex;gap:14px;height:100%;overflow-x:auto;overflow-y:hidden;padding:18px 20px 22px;align-items:flex-start;overscroll-behavior-x:contain}
.col{
  flex:0 0 290px;width:290px;background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:var(--r);display:flex;flex-direction:column;max-height:100%;min-height:130px;
  box-shadow:var(--sh-1);overflow:hidden;
}
.col::before{content:"";display:block;height:3px;flex:0 0 auto;background:var(--c,var(--accent))}
.col.dropping{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:11px 12px 9px;min-width:0}
.colname{font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{flex:0 0 auto;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.col-menu{flex:0 0 auto;width:26px;height:26px;border-radius:7px;color:var(--text-3);display:grid;place-items:center}
.col-menu:hover{background:var(--line-soft);color:var(--text)}
.col-b{display:flex;flex-direction:column;gap:9px;padding:0 10px 10px;overflow-y:auto;min-height:40px}
.col-add{flex:0 0 auto;margin:0 10px 11px;padding:8px;border-radius:9px;border:1px dashed var(--line);color:var(--text-2);font-size:12.5px}
.col-add:hover{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.addcol{flex:0 0 210px;padding:13px;border-radius:var(--r);border:1px dashed var(--line);color:var(--text-2);font-size:13px;text-align:left}
.addcol:hover{border-color:var(--accent);color:var(--accent)}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);
  overflow:hidden;position:relative;cursor:pointer;box-shadow:var(--sh-1);
  transition:box-shadow .15s,border-color .15s;
}
.card:hover{border-color:var(--accent-2);box-shadow:var(--sh-2)}
.card.lifted{opacity:.3}
.cover{height:70px;background-size:cover;background-position:center;flex:0 0 auto}
.cover.gr{background-image:linear-gradient(120deg,var(--c1),var(--c2))}
.card-b{padding:10px 11px 11px;display:flex;flex-direction:column;gap:7px;min-width:0}
.card-t{font-size:13.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.tag{
  max-width:100%;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:var(--r-xs);
  background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);
  border:1px solid color-mix(in srgb,var(--c) 32%,transparent);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
:root[data-theme="dark"] .tag,:root:not([data-theme="light"]) .tag{background:color-mix(in srgb,var(--c) 24%,transparent)}
.tagx{
  max-width:100%;font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:var(--r-xs);
  border:1px solid var(--line);color:var(--text-2);background:var(--surface-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cat{
  display:flex;align-items:center;gap:5px;min-width:0;font-size:11px;color:var(--text-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:0 0 auto}
.card-f{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
.when{font-size:11.5px;color:var(--text-2);display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.when.late{color:var(--rose);font-weight:600}
.who-stack{display:flex;margin-left:auto;flex:0 0 auto}
.who-stack img{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);margin-left:-7px;object-fit:cover}
.who-stack img:first-child{margin-left:0}
.grip{
  position:absolute;top:0;right:0;width:32px;height:32px;display:grid;place-items:center;
  color:var(--text-3);touch-action:none;z-index:2;font-size:11px;
}
.grip:hover{color:var(--text)}
.dragged{
  position:fixed;z-index:95;width:270px;pointer-events:none;box-shadow:var(--shadow-pop);
  transform:rotate(1.5deg);border-radius:var(--r-s);overflow:hidden;background:var(--surface);
}

/* ===== calendário ===== */
.cal-top{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.cal-top h2{margin:0;font-size:16.5px;text-transform:capitalize;flex:1 1 auto;min-width:130px}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;
  background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;
}
.cal-hd{background:var(--surface-2);padding:8px 9px;font-size:11px;color:var(--text-2);font-weight:600;text-align:center}
.cell{background:var(--surface);min-height:122px;padding:7px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden}
.cell.out{background:var(--surface-2)}
.cell.out .cell-n{color:var(--text-3)}
.cell.dropping{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cell-n{display:flex;align-items:center;gap:5px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-2);flex:0 0 auto}
.cell-n b{font-weight:600;padding:0 3px;border-radius:var(--r-xs)}
.cell.today .cell-n b{background:var(--accent-grad);color:#fff;padding:0 6px}
.cell-n .add{margin-left:auto;opacity:0;color:var(--text-3);font-size:15px;width:20px;height:20px;border-radius:var(--r-xs);flex:0 0 auto}
.cell:hover .cell-n .add,.cell:focus-within .cell-n .add{opacity:1}
.cell-n .add:hover{background:var(--accent-soft);color:var(--accent)}
.ev{
  flex:0 0 auto;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:var(--r-xs);
  background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border-left:2px solid var(--c);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.mini{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 6px;
  border-radius:var(--r-xs);background:var(--surface-2);border:1px solid var(--line-soft);
  text-align:left;width:100%;max-width:100%;overflow:hidden;
}
.mini:hover{border-color:var(--accent-2);background:var(--surface)}
.mini>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mini .dot{width:6px;height:6px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c);display:block}

/* ===== listas / banco ===== */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar>strong{min-width:0}
.toolbar .g{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar .g label.f{margin:0;flex:0 0 auto}
select.sel,input.inp,textarea.inp{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);
  padding:8px 10px;font-size:13px;outline:none;width:100%;min-width:0;
}
select.sel{height:36px;padding:0 9px}
.inp:focus,select.sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.55}
.rows{border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--sh-1)}
.row{
  display:grid;
  grid-template-columns:46px minmax(0,1fr) minmax(0,150px) minmax(0,130px) minmax(0,96px) minmax(0,92px);
  gap:12px;align-items:center;padding:10px 13px;border-bottom:1px solid var(--line-soft);
  text-align:left;width:100%;min-width:0;
}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.hd{background:var(--surface-2);font-size:11px;color:var(--text-2);font-weight:600;pointer-events:none}
.row>*{min-width:0;overflow:hidden}
.thumb{width:46px;height:34px;border-radius:var(--r-xs);background-size:cover;background-position:center;flex:0 0 auto}
.thumb.gr{background-image:linear-gradient(120deg,var(--c1),var(--c2))}
.rt{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsub{font-size:11.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis}
.rowact{width:28px;height:28px;border-radius:var(--r-xs);color:var(--text-3);display:grid;place-items:center;flex:0 0 auto}
.rowact:hover{background:var(--surface-3);color:var(--accent)}
.empty{padding:48px 22px;text-align:center;color:var(--text-2)}
.empty b{display:block;font-size:15.5px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty p{margin:0 auto;max-width:44ch;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:17px;margin-bottom:15px;box-shadow:var(--sh-1)}
.panel h3{margin:0 0 3px;font-size:15px}
.panel p.hint{margin:0 0 14px;font-size:12.5px;color:var(--text-2);max-width:64ch}
.panel p.hint:empty{display:none;margin:0}
.tag-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);min-width:0}
.tag-row:last-child{border-bottom:0}
.tag-row>span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);padding:0;overflow:hidden;flex:0 0 auto;cursor:pointer}
.sw.mini-sw{width:14px;height:14px;border-radius:5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px;margin-bottom:15px}
.kpi{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh-1);min-width:0}
.kpi b{display:block;font-size:23px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--text-2)}

/* filtros rápidos e agrupamento */
.quick{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;box-shadow:var(--sh-1)}
.qrow{display:flex;align-items:flex-start;gap:10px;padding:6px 0;min-width:0}
.qrow+.qrow{border-top:1px dashed var(--line-soft)}
.qlab{font-size:11.5px;color:var(--text-2);font-weight:600;min-width:88px;padding-top:5px;flex:0 0 auto}
.qrow .pick{flex:1 1 auto;min-width:0}
.ghd{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-2);margin:18px 0 7px;min-width:0}
.ghd:first-child{margin-top:0}
.ghd .n{font-weight:400;color:var(--text-3)}

/* ===== ideias ===== */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:12px}
.idea{
  background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--c,var(--accent));
  border-radius:var(--r);padding:13px;display:flex;flex-direction:column;gap:9px;min-width:0;box-shadow:var(--sh-1);
}
.idea h4{margin:0;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.idea .nota{margin:0;font-size:12.5px;color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.idea .ref{font-size:12px;color:var(--accent);overflow-wrap:anywhere;text-decoration:none}
.idea .ref:hover{text-decoration:underline}
.idea .acts{display:flex;gap:7px;margin-top:auto;flex-wrap:wrap}
.idea .acts .btn{height:31px;padding:0 11px;font-size:12px}

/* ===== folhas / modais ===== */
.scrim{position:fixed;inset:0;background:rgba(20,8,40,.52);z-index:60;display:none;backdrop-filter:blur(2px)}
.scrim.on{display:block}
.sheet{
  position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;
  top:50%;left:50%;transform:translate(-50%,-50%);width:min(690px,calc(100vw - 28px));
  max-height:min(88vh,calc(100% - 40px));overflow:hidden;
}
.sheet.narrow{width:min(440px,calc(100vw - 28px))}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--line-soft);flex:0 0 auto}
.sh-h h2{margin:0;font-size:15.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-b{padding:17px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.sh-f{
  padding:12px 17px;border-top:1px solid var(--line-soft);display:flex;gap:9px;align-items:center;
  flex-wrap:wrap;flex:0 0 auto;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
}
.x{width:30px;height:30px;border-radius:8px;color:var(--text-2);display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.x:hover{background:var(--surface-2);color:var(--text)}
label.f{display:block;font-size:11.5px;color:var(--text-2);margin-bottom:6px;font-weight:600}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.pick button{
  max-width:100%;font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);
  color:var(--text-2);background:var(--surface-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pick button:hover{border-color:var(--accent-2);color:var(--text)}
.pick button[aria-pressed="true"]{
  border-color:var(--c,var(--accent));color:var(--c,var(--accent));font-weight:600;
  background:color-mix(in srgb,var(--c,var(--accent)) 13%,transparent);
}
.who-pick{display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-width:0}
.who-chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:3px 9px 3px 3px;border-radius:20px;border:1px solid var(--line);font-size:12px;background:var(--surface-2);overflow:hidden}
.who-chip img{width:22px;height:22px;border-radius:50%;flex:0 0 auto}
.who-chip button{flex:0 0 auto;color:var(--text-3);font-size:13px;width:15px}
.res{border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);max-height:190px;overflow:auto;margin-top:7px}
.res button{display:flex;align-items:center;gap:10px;padding:8px 11px;width:100%;text-align:left;font-size:13px;min-width:0}
.res button:hover{background:var(--surface-2)}
.res img{width:26px;height:26px;border-radius:50%;flex:0 0 auto}
.cover-pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cover-pick .sw{width:32px;height:26px}
.cover-prev{height:96px;border-radius:var(--r-s);background-size:cover;background-position:center;border:1px solid var(--line-soft)}
.cover-prev.gr{background-image:linear-gradient(120deg,var(--c1),var(--c2))}
.chk{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;min-width:0;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent);flex:0 0 auto;cursor:pointer}
.chk s{color:var(--text-3)}
.chk>button{margin-left:auto;color:var(--text-3);font-size:15px;flex:0 0 auto}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:2px 14px}
.chkgrid .chk{padding:4px 0;font-size:12.5px}
.chkgrid .chk span{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);flex:0 0 auto}
.segs button{padding:6px 14px;font-size:12px;color:var(--text-2)}
.segs button[aria-pressed="true"]{background:var(--accent-grad);color:#fff;font-weight:600}
.modo-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modo-bar>span{font-size:11.5px;color:var(--text-3);min-width:0}
.danger{color:var(--rose);font-size:12.5px;font-weight:600;padding:7px 9px;border-radius:8px}
.danger:hover{background:color-mix(in srgb,var(--rose) 12%,transparent)}
.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
  z-index:120;box-shadow:var(--shadow-pop);max-width:88vw;text-align:center;
}
[data-drop^="nav"].dropping{background:var(--accent-grad);color:#fff;border-color:transparent}

/* ===== grade de resultados ===== */
.grid-ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}
.tile{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line-soft);box-shadow:var(--sh-1);cursor:pointer;display:flex;flex-direction:column;min-width:0;text-align:left}
.tile:hover{border-color:var(--accent-2);box-shadow:var(--sh-2)}
.tile .ph{aspect-ratio:1/1;background-color:var(--surface-3);background-size:cover;background-position:center;position:relative;flex:0 0 auto}
.tile .ph.gr{background-image:linear-gradient(120deg,var(--c1),var(--c2))}
.tile .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:16px;color:#fff;font-size:13px;font-weight:600;background:linear-gradient(0deg,rgba(20,8,40,.66),rgba(20,8,40,.14));opacity:0;transition:opacity .15s}
.tile:hover .ov,.tile:focus-visible .ov{opacity:1}
.tile .badge{position:absolute;top:8px;left:8px;max-width:calc(100% - 16px);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:rgba(20,8,40,.6);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .meta{padding:10px 11px;display:flex;flex-direction:column;gap:5px;min-width:0}
.metrics{display:flex;gap:11px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums;min-width:0}
.metrics span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.metrics b{color:var(--text);font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.statgrid label.f{margin-bottom:4px}
.dropzone{border:1px dashed var(--line);border-radius:var(--r-s);padding:10px;font-size:12px;color:var(--text-2);text-align:center}
.dropzone.hot{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ===== responsivo ===== */
@media (max-width:1140px){
  :root{--grid:226px minmax(0,1fr)}
  .row{grid-template-columns:46px minmax(0,1fr) minmax(0,128px) minmax(0,92px) minmax(0,88px)}
  .row .c-who{display:none}
}
@media (max-width:980px){
  .row{grid-template-columns:46px minmax(0,1fr) minmax(0,110px) minmax(0,88px)}
  .row .c-tags{display:none}
}
@media (max-width:880px){
  :root{--grid:minmax(0,1fr)}
  aside{
    position:fixed;inset:0 auto 0 0;width:276px;max-width:86vw;z-index:80;
    transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow-pop);
  }
  aside.open{transform:none}
  .burger{display:flex;order:1}
  .vt{order:2;flex:1 1 90px}
  .topbar>.btn{order:3}
  .psel{order:10;flex:1 1 44%;width:auto}
  .search{order:11;flex:2 1 48%;width:auto;display:flex}
  .search.hide-sm{display:flex}
  .topbar{padding:11px 14px;padding-top:calc(11px + env(safe-area-inset-top,0px))}
  .filterbar{padding:9px 14px}
  .view{padding:14px}
  .board{padding:14px;gap:12px;scroll-snap-type:x proximity}
  .col{flex-basis:82vw;width:82vw;scroll-snap-align:start}
  .cell{min-height:74px;gap:3px;padding:5px}
  .cell .mini,.cell .ev{display:none}
  .dots{display:flex}
  .cal-hd{padding:6px 2px;font-size:10px}
  .row{grid-template-columns:40px minmax(0,1fr) minmax(0,72px);gap:10px;padding:9px 11px}
  .row .c-cat{display:none}
  .thumb{width:40px;height:31px}
  .two{grid-template-columns:minmax(0,1fr)}
  .hide-sm{display:none}
  .qlab{min-width:100%;padding-top:0}
  .qrow{flex-wrap:wrap}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet{border-radius:var(--r-lg) var(--r-lg) 0 0;top:auto;bottom:0;left:0;transform:none;width:100%;max-width:100%;max-height:93%}
  .sh-b{padding:15px}
  .ideas{grid-template-columns:minmax(0,1fr)}
  .grid-ig{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile .ov{opacity:1;background:linear-gradient(0deg,rgba(20,8,40,.5),transparent 55%);gap:12px;align-items:flex-end;padding-bottom:8px;font-size:12px}
}
@media (max-width:420px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .kpi b{font-size:20px}
  .btn{padding:0 12px}
}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="mark">V</div>
      <div><b>VDE Studio</b><span>Produção de conteúdo</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="who" id="who"></div>
      <div class="side-actions">
        <button class="ghost-d" id="themeBtn" title="Alternar tema">◐ Tema</button>
        <button class="ghost-d" id="exportBtn" title="Exportar para o calendário">↧ Calendário</button>
      </div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Abrir menu">☰</button>
      <div class="vt"><h1 id="vTitle">Kanban</h1><p id="vSub"></p></div>
      <select class="sel psel hidden" id="perfilSel" aria-label="Filtrar por perfil"></select>
      <div class="search hide-sm">
        <span>⌕</span>
        <input id="q" type="search" placeholder="Buscar posts, briefings, canais…" autocomplete="off">
      </div>
      <button class="btn sec icon" id="filterBtn" title="Filtros">⚟</button>
      <button class="btn" id="newBtn"><span>+</span><span class="hide-sm">Novo post</span></button>
    </header>
    <div class="filterbar" id="filterbar"></div>
    <section class="view" id="view"></section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<div id="sheetHost"></div>
<div id="dragHost"></div>
<script>
/* =========================================================
   VDE Studio — núcleo
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const PH='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const PAL=['#7c3aed','#a855f7','#c084fc','#6d28d9','#4c1d95','#db2777','#4f46e5','#8b7fa3'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
const HORAS=['08:00','09:00','10:00','11:00','12:00','15:00','17:00','18:00','19:00','20:00','21:00'];

function isoOf(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function dOf(s){const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)}
const HOJE=isoOf(new Date());
function fmtCurto(s){if(!s)return'';const d=dOf(s);return d.getDate()+' '+MESC[d.getMonth()]}
function fmtLongo(s){if(!s)return'';const d=dOf(s);return DOW[d.getDay()]+', '+d.getDate()+' de '+MES[d.getMonth()]}
const METRICAS=[['likes','Curtidas','♥'],['comments','Comentários','💬'],['saves','Salvamentos','⌸'],['shares','Compartilh.','↗'],['reach','Alcance','◎'],['views','Visualizações','▷']];
function fmtNum(n){
  n=Number(n)||0;
  if(n>=1000000)return (n/1000000).toFixed(n%1000000?1:0).replace('.',',')+' mi';
  if(n>=1000)return (n/1000).toFixed(n%1000?1:0).replace('.',',')+' mil';
  return String(n);
}
function idDoLink(u){
  u=String(u||'').trim();if(!u)return '';
  const m=u.match(/\/(?:p|reel|reels|tv)\/([A-Za-z0-9_-]+)/);
  if(m)return m[1].toLowerCase();
  return u.replace(/^https?:\/\//i,'').replace(/^www\./i,'').replace(/[?#].*$/,'').replace(/\/+$/,'').toLowerCase();
}
function engaj(st){
  if(!st)return null;
  const i=(+st.likes||0)+(+st.comments||0)+(+st.saves||0)+(+st.shares||0);
  const base=+st.reach||+st.views||0;
  return base?i/base:null;
}
function temStats(st){return st&&METRICAS.some(([k])=>Number(st[k])>0)}
function store(k,v){try{if(v===undefined)return localStorage.getItem('vde.'+k);localStorage.setItem('vde.'+k,v)}catch(e){return null}}

const S={
  db:null,user:null,assets:null,downloads:null,
  ready:false,canWrite:true,demo:false,
  me:{id:null,name:'',avatarUrl:PH},
  board:{columns:[],cats:[],tags:[],perfis:[],plataformas:[],formatos:[]},
  posts:new Map(),events:new Map(),ideas:new Map(),
  profiles:{},asking:new Set(),
  view:store('view')||'kanban',
  filters:{q:'',tags:[],cats:[],people:[],cols:[],perfis:[],plats:[],forms:[],de:'',ate:'',arq:false},
  cal:{y:new Date().getFullYear(),m:new Date().getMonth()},
  agrupar:store('agrupar')||'none',
  ordem:store('ordem')||'reach',
  modo:store('modo')||'completo',
  pendingRender:false
};

/* ---------- acesso a dados ---------- */
function normBoard(o){
  o=o||{};
  const arr=v=>Array.isArray(v)?v:[];
  return{columns:arr(o.columns),cats:arr(o.cats),tags:arr(o.tags),perfis:arr(o.perfis),plataformas:arr(o.plataformas),formatos:arr(o.formatos)};
}
async function saveBoard(next){
  S.board=normBoard(next);
  render();
  if(!S.db)return;
  try{await S.db.doc('config/board').set(S.board)}catch(e){falhou(e)}
}
async function putPost(id,data){
  S.posts.set(id,data);render();
  if(!S.db)return;
  try{await S.db.doc('posts/'+id).set(data)}catch(e){falhou(e)}
}
async function patchPost(id,patch){
  const cur=S.posts.get(id);if(!cur)return;
  return putPost(id,{...cur,...patch});
}
async function delPost(id){
  S.posts.delete(id);render();
  if(!S.db)return;
  try{await S.db.doc('posts/'+id).delete()}catch(e){falhou(e)}
}
async function putIdeia(id,data){
  S.ideas.set(id,data);render();
  if(!S.db)return;
  try{await S.db.doc('ideas/'+id).set(data)}catch(e){falhou(e)}
}
async function patchIdeia(id,patch){
  const cur=S.ideas.get(id);if(!cur)return;
  return putIdeia(id,{...cur,...patch});
}
async function delIdeia(id){
  S.ideas.delete(id);render();
  if(!S.db)return;
  try{await S.db.doc('ideas/'+id).delete()}catch(e){falhou(e)}
}
async function putEvento(id,data){
  S.events.set(id,data);render();
  if(!S.db)return;
  try{await S.db.doc('events/'+id).set(data)}catch(e){falhou(e)}
}
async function delEvento(id){
  S.events.delete(id);render();
  if(!S.db)return;
  try{await S.db.doc('events/'+id).delete()}catch(e){falhou(e)}
}
function falhou(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){S.canWrite=false;render();aviso('Você tem acesso de leitura neste board.')}
  else if(c==='quota_exceeded')aviso('Limite de registros atingido. Arquive ou exclua posts antigos.');
  else if(c==='resource_exhausted')aviso('Muitas alterações ao mesmo tempo. Tente de novo em instantes.');
  else if(c==='revoked')aviso('Seu acesso mudou. Recarregue a página.');
  else aviso('Não foi possível salvar agora.');
}

/* ---------- perfis (responsáveis) ---------- */
function prof(id){return S.profiles[id]||null}
function avatar(id,cls){
  const p=prof(id);
  return `<img class="${cls||''}" src="${p?esc(p.avatarUrl):PH}" style="background:${p?esc(p.color):'#c9c7c0'}" alt="">`;
}
function nome(id){const p=prof(id);return p&&p.name?p.name:'Alguém'}
async function resolverPerfis(ids){
  if(!S.user)return;
  const novos=[...new Set(ids)].filter(i=>i&&!S.profiles[i]&&!S.asking.has(i));
  if(!novos.length)return;
  novos.forEach(i=>S.asking.add(i));
  const res=await S.user.profiles(novos);
  let mudou=false;
  for(const id in res){S.profiles[id]=res[id];mudou=true}
  if(mudou)render();
}

/* ---------- filtros ---------- */
function ativos(){
  const f=S.filters;
  return f.q.trim()||f.tags.length||f.cats.length||f.people.length||f.cols.length||f.perfis.length||f.plats.length||f.forms.length||f.de||f.ate||f.arq;
}
function passa(p){
  const f=S.filters;
  if(!f.arq&&p.archived)return false;
  if(f.q.trim()){
    const t=(p.title+' '+(p.brief||'')+' '+(p.channel||'')+' '+(p.link||'')).toLowerCase();
    if(!t.includes(f.q.trim().toLowerCase()))return false;
  }
  if(f.cols.length&&!f.cols.includes(p.col))return false;
  if(f.perfis.length&&!f.perfis.includes(p.perfil))return false;
  if(f.plats.length&&!(p.plats||[]).some(x=>f.plats.includes(x)))return false;
  if(f.forms.length&&!(p.forms||[]).some(x=>f.forms.includes(x)))return false;
  if(f.cats.length&&!f.cats.includes(p.cat))return false;
  if(f.tags.length&&!(p.tags||[]).some(t=>f.tags.includes(t)))return false;
  if(f.people.length&&!(p.people||[]).some(u=>f.people.includes(u)))return false;
  if(f.de&&(!p.date||p.date<f.de))return false;
  if(f.ate&&(!p.date||p.date>f.ate))return false;
  return true;
}
function lista(){
  return [...S.posts.entries()].map(([id,p])=>({id,...p})).filter(passa);
}
function porColuna(colId){
  return lista().filter(p=>p.col===colId&&!p.archived)
    .sort((a,b)=>(a.order??0)-(b.order??0)||String(a.date||'9').localeCompare(String(b.date||'9')));
}
const acharTag=id=>S.board.tags.find(t=>t.id===id);
const acharCat=id=>S.board.cats.find(c=>c.id===id);
const acharCol=id=>S.board.columns.find(c=>c.id===id);
const acharPerfil=id=>(S.board.perfis||[]).find(p=>p.id===id);
const acharPlat=id=>(S.board.plataformas||[]).find(p=>p.id===id);
const acharForm=id=>(S.board.formatos||[]).find(p=>p.id===id);
const nomes=(ids,fn)=>(ids||[]).map(fn).filter(Boolean);

/* ---------- chrome ---------- */
const VIEWS=[
  {id:'kanban',ic:'▤',t:'Kanban',sub:'Fluxo de produção, do briefing ao publicado',g:1},
  {id:'calendar',ic:'▦',t:'Calendário',sub:'Quando cada peça vai ao ar',g:1},
  {id:'bank',ic:'◱',t:'Banco de postagens',sub:'Todo post criado cai aqui — filtre por perfil, categoria, tag ou responsável',g:1},
  {id:'ideas',ic:'✧',t:'Banco de ideias',sub:'Ideias e referências guardadas até virarem pauta',g:1},
  {id:'perf',ic:'◔',t:'Resultados',sub:'Alcance e engajamento do que já foi publicado',g:1},
  {id:'events',ic:'◈',t:'Calendário da empresa',sub:'Lançamentos, campanhas e datas que puxam a pauta',g:1},
  {id:'tax',ic:'◎',t:'Estrutura',sub:'Perfis, colunas, categorias e tags',g:2}
];
function chrome(){
  $('#nav').innerHTML=
    `<div class="navlabel">Trabalho</div>`+VIEWS.filter(v=>v.g===1).map(v=>navItem(v)).join('')+
    `<div class="navlabel">Configuração</div>`+VIEWS.filter(v=>v.g===2).map(v=>navItem(v)).join('');
  $$('#nav .nav-i').forEach(b=>b.onclick=()=>{
    S.view=b.dataset.v;store('view',S.view);$('#sidebar').classList.remove('open');$('#scrim').classList.remove('on');render();
  });
  const v=VIEWS.find(x=>x.id===S.view)||VIEWS[0];
  $('#vTitle').textContent=v.t;$('#vSub').textContent=v.sub;
  $('#newBtn').classList.toggle('hidden',!S.canWrite||S.view==='tax'||S.view==='perf');
  $('#newBtn').lastElementChild.textContent=S.view==='ideas'?'Nova ideia':S.view==='events'?'Novo evento':'Novo post';
  pintarPerfilSel();
}
function pintarPerfilSel(){
  const el=$('#perfilSel'),ps=S.board.perfis||[];
  if(!el)return;
  if(!ps.length){el.classList.add('hidden');return}
  el.classList.remove('hidden');
  const cur=S.filters.perfis.length===1?S.filters.perfis[0]:'';
  el.innerHTML=`<option value="">Todos os perfis</option>`+ps.map(p=>`<option value="${p.id}" ${cur===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
  el.onchange=()=>{S.filters.perfis=el.value?[el.value]:[];render()};
}
function navItem(v){
  let n='';
  if(v.id==='bank')n=`<span class="pill">${[...S.posts.values()].filter(p=>!p.archived).length}</span>`;
  if(v.id==='ideas')n=`<span class="pill">${[...S.ideas.values()].filter(i=>!i.scheduledPostId).length}</span>`;
  if(v.id==='events')n=`<span class="pill">${S.events.size}</span>`;
  return `<button class="nav-i" data-v="${v.id}" aria-current="${S.view===v.id}"><span class="ic">${v.ic}</span><span>${v.t}</span>${n}</button>`;
}
function barraFiltros(){
  const el=$('#filterbar');
  if(!ativos()){el.innerHTML='';return}
  const f=S.filters,ch=[];
  const chip=(rot,val,acao)=>`<span class="fchip">${rot} <b>${esc(val)}</b><button data-rm="${acao}">×</button></span>`;
  if(f.q.trim())ch.push(chip('busca',f.q.trim(),'q'));
  f.perfis.forEach(id=>ch.push(chip('perfil',(acharPerfil(id)||{}).name||'—','per:'+id)));
  f.plats.forEach(id=>ch.push(chip('plataforma',(acharPlat(id)||{}).name||'—','plt:'+id)));
  f.forms.forEach(id=>ch.push(chip('formato',(acharForm(id)||{}).name||'—','frm:'+id)));
  f.cols.forEach(id=>ch.push(chip('coluna',(acharCol(id)||{}).name||'—','col:'+id)));
  f.cats.forEach(id=>ch.push(chip('categoria',(acharCat(id)||{}).name||'—','cat:'+id)));
  f.tags.forEach(id=>ch.push(chip('tag',(acharTag(id)||{}).name||'—','tag:'+id)));
  f.people.forEach(id=>ch.push(chip('resp.',nome(id),'pes:'+id)));
  if(f.de)ch.push(chip('de',fmtCurto(f.de),'de'));
  if(f.ate)ch.push(chip('até',fmtCurto(f.ate),'ate'));
  if(f.arq)ch.push(chip('','incluindo arquivados','arq'));
  el.innerHTML=ch.join('')+`<button class="fclear" id="fclear">Limpar tudo</button>`;
  $('#fclear').onclick=()=>{S.filters={q:'',tags:[],cats:[],people:[],cols:[],perfis:[],plats:[],forms:[],de:'',ate:'',arq:false};$('#q').value='';render()};
  $$('#filterbar [data-rm]').forEach(b=>b.onclick=()=>{
    const[k,v]=b.dataset.rm.split(':');
    if(k==='q'){S.filters.q='';$('#q').value=''}
    else if(k==='de')S.filters.de='';
    else if(k==='ate')S.filters.ate='';
    else if(k==='arq')S.filters.arq=false;
    else{const map={col:'cols',cat:'cats',tag:'tags',pes:'people',per:'perfis',plt:'plats',frm:'forms'}[k];S.filters[map]=S.filters[map].filter(x=>x!==v)}
    render();
  });
}
function render(){
  if(S.pendingRender)return;
  S.pendingRender=true;
  requestAnimationFrame(()=>{
    S.pendingRender=false;
    chrome();barraFiltros();
    const v=$('#view');
    v.className='view'+(S.view==='kanban'?' kanban':'');
    if(S.view==='kanban')viewKanban(v);
    else if(S.view==='calendar')viewCalendario(v);
    else if(S.view==='bank')viewBanco(v);
    else if(S.view==='ideas')viewIdeias(v);
    else if(S.view==='perf')viewResultados(v);
    else if(S.view==='events')viewEventos(v);
    else viewTax(v);
  });
}
function aviso(msg){
  $$('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3400);
}
function bannerTopo(txt){
  if($('#banner'))return;
  const b=document.createElement('div');b.className='banner';b.id='banner';b.innerHTML='<span>◔</span><span>'+esc(txt)+'</span>';
  $('main').insertBefore(b,$('#filterbar'));
}

function coverStyle(c){
  if(!c)return null;
  if(c.type==='img'&&c.asset)return{cls:'',style:`background-image:url('/_blob/${esc(c.asset)}')`};
  if(c.type==='grad')return{cls:'gr',style:`--c1:${esc(c.c1)};--c2:${esc(c.c2)}`};
  return null;
}

let ARRASTOU=0;
function ligarCards(root){
  $$('[data-card]',root).forEach(el=>{
    const id=el.dataset.card;
    el.addEventListener('click',e=>{
      if(e.target.closest('[data-grip]')||Date.now()-ARRASTOU<400)return;
      abrirPost(id);
    });
    el.addEventListener('keydown',e=>{if(e.key==='Enter')abrirPost(id)});
    if(!S.canWrite)return;
    el.addEventListener('pointerdown',e=>{
      if(e.pointerType!=='mouse'&&!e.target.closest('[data-grip]'))return;
      if(e.button!==0)return;
      iniciarArraste(e,id,el);
    });
  });
  $$('[data-mini]',root).forEach(el=>{
    el.addEventListener('click',()=>{if(Date.now()-ARRASTOU>400)abrirPost(el.dataset.mini)});
    if(!S.canWrite)return;
    el.addEventListener('pointerdown',e=>{
      if(e.pointerType!=='mouse'||e.button!==0)return;
      iniciarArraste(e,el.dataset.mini,el);
    });
  });
}

/* ---------- arrastar e soltar ---------- */
let DRAG=null;
function iniciarArraste(e,id,el){
  const x0=e.clientX,y0=e.clientY;
  const r=el.getBoundingClientRect();
  DRAG={id,el,x0,y0,dx:x0-r.left,dy:y0-r.top,ativo:false,clone:null,alvo:null};
  const mv=ev=>{
    if(!DRAG)return;
    if(!DRAG.ativo){
      if(Math.abs(ev.clientX-x0)<6&&Math.abs(ev.clientY-y0)<6)return;
      DRAG.ativo=true;
      const c=el.cloneNode(true);c.classList.add('dragged');c.style.width=r.width+'px';
      $('#dragHost').appendChild(c);DRAG.clone=c;el.classList.add('lifted');
      document.body.style.userSelect='none';
    }
    DRAG.clone.style.left=(ev.clientX-DRAG.dx)+'px';
    DRAG.clone.style.top=(ev.clientY-DRAG.dy)+'px';
    const sob=document.elementFromPoint(ev.clientX,ev.clientY);
    const zona=sob&&sob.closest('[data-drop]');
    if(DRAG.alvo&&DRAG.alvo!==zona)DRAG.alvo.classList.remove('dropping');
    DRAG.alvo=zona||null;
    if(zona)zona.classList.add('dropping');
    if(zona&&/^nav:/.test(zona.dataset.drop||'')){
      if(!DRAG.navT)DRAG.navT=setTimeout(()=>{
        if(!DRAG)return;
        DRAG.navT=null;
        const dir=zona.dataset.drop==='nav:next'?1:-1;
        S.cal.m+=dir;
        if(S.cal.m>11){S.cal.m=0;S.cal.y++}
        if(S.cal.m<0){S.cal.m=11;S.cal.y--}
        render();
      },550);
    }else if(DRAG.navT){clearTimeout(DRAG.navT);DRAG.navT=null}
    DRAG.py=ev.clientY;
    autoScroll(ev);
  };
  const up=()=>{
    window.removeEventListener('pointermove',mv);
    window.removeEventListener('pointerup',up);
    window.removeEventListener('pointercancel',up);
    document.body.style.userSelect='';
    if(!DRAG)return;
    const d=DRAG;DRAG=null;
    if(d.navT)clearTimeout(d.navT);
    if(d.clone)d.clone.remove();
    d.el.classList.remove('lifted');
    if(d.alvo)d.alvo.classList.remove('dropping');
    if(!d.ativo)return;
    ARRASTOU=Date.now();
    if(!d.alvo)return;
    const[tipo,val]=d.alvo.dataset.drop.split(':');
    if(tipo==='col')soltarNaColuna(d.id,val,d.py);
    if(tipo==='day')patchPost(d.id,{date:val});
  };
  window.addEventListener('pointermove',mv,{passive:true});
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
}
function autoScroll(ev){
  const b=$('.board');if(!b)return;
  const r=b.getBoundingClientRect();
  if(ev.clientX>r.right-60)b.scrollLeft+=14;
  else if(ev.clientX<r.left+60)b.scrollLeft-=14;
}
function soltarNaColuna(id,colId,py){
  const irmaos=porColuna(colId).filter(p=>p.id!==id);
  let idx=irmaos.length;
  const body=$(`[data-body="${colId}"]`);
  if(body&&py!=null){
    const cards=$$('[data-card]',body).filter(c=>c.dataset.card!==id);
    idx=cards.findIndex(c=>{const r=c.getBoundingClientRect();return py<r.top+r.height/2});
    if(idx<0)idx=cards.length;
  }
  const antes=idx>0?(irmaos[idx-1].order??0):null;
  const dps=idx<irmaos.length?(irmaos[idx].order??0):null;
  let ordem;
  if(antes==null&&dps==null)ordem=1000;
  else if(antes==null)ordem=dps-500;
  else if(dps==null)ordem=antes+500;
  else ordem=(antes+dps)/2;
  patchPost(id,{col:colId,order:ordem});
}

   Calendário
   ========================================================= */
function eventosDoDia(iso){
  return [...S.events.entries()].map(([id,e])=>({id,...e}))
    .filter(e=>iso>=e.date&&iso<=(e.end||e.date));
}
function viewCalendario(root){
  const{y,m}=S.cal;
  const prim=new Date(y,m,1),ini=new Date(y,m,1-prim.getDay());
  const posts=lista().filter(p=>p.date);
  const porDia={};posts.forEach(p=>{(porDia[p.date]=porDia[p.date]||[]).push(p)});
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+i),k=isoOf(d);
    const fora=d.getMonth()!==m;
    if(i>=35&&fora)continue;
    const ps=(porDia[k]||[]).sort((a,b)=>String(a.time||'99').localeCompare(String(b.time||'99')));
    const evs=eventosDoDia(k);
    cells+=`<div class="cell ${fora?'out':''} ${k===HOJE?'today':''}" data-drop="day:${k}" data-day="${k}">
      <div class="cell-n"><b>${d.getDate()}</b>${S.canWrite?`<button class="add" data-newday="${k}" aria-label="Novo post neste dia">+</button>`:''}</div>
      ${evs.map(e=>`<div class="ev" style="--c:${esc(e.color)}" title="${esc(e.title)}">${esc(e.title)}</div>`).join('')}
      ${ps.map(p=>{const c=acharCol(p.col)||{color:'#4b5161'};
        return `<button class="mini" data-mini="${p.id}"><i class="dot" style="--c:${esc(c.color)}"></i><span>${p.time?esc(p.time)+' ':''}${esc(p.title||'Sem título')}</span></button>`}).join('')}
      <div class="dots">${ps.map(p=>{const c=acharCol(p.col)||{color:'#4b5161'};return `<i style="--c:${esc(c.color)}"></i>`}).join('')}${evs.map(e=>`<i style="--c:${esc(e.color)}"></i>`).join('')}</div>
    </div>`;
  }
  root.innerHTML=`
    <div class="cal-top">
      <button class="btn sec icon" id="calPrev" data-drop="nav:prev" aria-label="Mês anterior">‹</button>
      <button class="btn sec icon" id="calNext" data-drop="nav:next" aria-label="Próximo mês">›</button>
      <h2>${MES[m]} ${y}</h2>
      <button class="btn sec" id="calHoje">Hoje</button>
      <div style="margin-left:auto;display:flex;gap:8px">
        <span class="fchip">${posts.length} <b>posts no filtro</b></span>
      </div>
    </div>
    <div class="cal-grid">
      ${DOW.map(d=>`<div class="cal-hd">${d}</div>`).join('')}
      ${cells}
    </div>
    <p class="rsub" style="margin-top:10px">Clique em qualquer dia para ver o que está agendado e criar um post já com a data. Arraste um post de um dia para outro e a data muda sozinha — parando sobre ‹ ou › ele troca de mês no meio do arraste.</p>`;
  $('#calPrev').onclick=()=>{S.cal.m--;if(S.cal.m<0){S.cal.m=11;S.cal.y--}render()};
  $('#calNext').onclick=()=>{S.cal.m++;if(S.cal.m>11){S.cal.m=0;S.cal.y++}render()};
  $('#calHoje').onclick=()=>{S.cal={y:new Date().getFullYear(),m:new Date().getMonth()};render()};
  $$('.cell',root).forEach(c=>c.style.cursor='pointer');
  $$('[data-newday]',root).forEach(b=>b.onclick=e=>{e.stopPropagation();abrirPost(null,{date:b.dataset.newday})});
  ligarCards(root);
  $$('[data-day]',root).forEach(c=>c.addEventListener('click',e=>{
    if(e.target.closest('.mini')||e.target.closest('.add'))return;
    if(Date.now()-ARRASTOU<400)return;
    folhaDoDia(c.dataset.day);
  }));
  resolverPerfis(posts.flatMap(p=>p.people||[]));
}
function folhaDoDia(k){
  const ps=lista().filter(p=>p.date===k),evs=eventosDoDia(k);
  abrirFolha({
    titulo:fmtLongo(k),narrow:true,
    corpo:`${evs.map(e=>`<div class="ev" style="--c:${esc(e.color)}">${esc(e.title)}</div>`).join('')}
      ${ps.length?`<div class="rows">${ps.map(p=>`<div class="row" style="grid-template-columns:46px minmax(0,1fr) 28px">
        <div data-mini="${p.id}" style="cursor:pointer">${miniThumb(p)}</div>
        <div data-mini="${p.id}" style="cursor:pointer;min-width:0"><div class="rt">${esc(p.title||'Sem título')}</div><div class="rsub">${esc((acharCol(p.col)||{}).name||'')}${p.time?' · '+esc(p.time):''}</div></div>
        ${S.canWrite?`<button class="rowact" data-mv="${p.id}" title="Mudar a data">⇄</button>`:''}
      </div>`).join('')}</div>`
      :`<p class="rsub">Nada agendado neste dia.</p>`}`,
    rodape:S.canWrite?`<button class="btn" data-act="novo">+ Criar post em ${fmtCurto(k)}</button><button class="btn sec" data-act="ideia">✧ Puxar do banco de ideias</button>`:'',
    ligar:(el,fechar)=>{
      $$('[data-mini]',el).forEach(b=>b.onclick=()=>{fechar();abrirPost(b.dataset.mini)});
      $$('[data-mv]',el).forEach(b=>b.onclick=async()=>{
        const nova=await pedirData(k);
        if(nova){patchPost(b.dataset.mv,{date:nova});aviso('Post movido para '+fmtCurto(nova)+'.')}
      });
      const n=$('[data-act="novo"]',el);if(n)n.onclick=()=>{fechar();abrirPost(null,{date:k})};
      const i=$('[data-act="ideia"]',el);if(i)i.onclick=()=>{fechar();escolherIdeia(k)};
    }
  });
}
function miniThumb(p){
  const c=coverStyle(p.cover);
  return c?`<div class="thumb ${c.cls}" style="${c.style}"></div>`
          :`<div class="thumb" style="background:${esc((acharCol(p.col)||{color:'#c9c7c0'}).color)}22;border:1px solid var(--line-soft)"></div>`;
}

function chipsRapidos(){
  const f=S.filters;
  const linha=(lab,itens,sel,attr)=>itens.length?`<div class="qrow"><span class="qlab">${lab}</span><div class="pick">

function agrupar(l){
  const m=S.agrupar;
  if(m==='none')return[{label:null,itens:l}];
  const multi={tag:['tags','tags','Sem tag'],plat:['plataformas','plats','Sem plataforma'],form:['formatos','forms','Sem formato']}[m];
  if(multi){
    const src=S.board[multi[0]]||[],campo=multi[1];
    const gs=src.map(t=>({label:t.name,color:t.color,itens:l.filter(p=>(p[campo]||[]).includes(t.id))})).filter(g=>g.itens.length);
    const ids=src.map(t=>t.id);
    const sem=l.filter(p=>!(p[campo]||[]).some(t=>ids.includes(t)));
    if(sem.length)gs.push({label:multi[2],color:'#8b7fa3',itens:sem});
    return gs;
  }
  const src=m==='cat'?S.board.cats:m==='perfil'?(S.board.perfis||[]):S.board.columns;
  const campo=m==='cat'?'cat':m==='perfil'?'perfil':'col';
  const gs=src.map(i=>({label:i.name,color:i.color,itens:l.filter(p=>p[campo]===i.id)})).filter(g=>g.itens.length);
  const ids=src.map(i=>i.id);
  const sem=l.filter(p=>!ids.includes(p[campo]));
  if(sem.length)gs.push({label:m==='cat'?'Sem categoria':m==='perfil'?'Sem perfil':'Sem coluna',color:'#8b7fa3',itens:sem});
  return gs;
}

https://instagram.com/p/ABC123/,840,37,52,12400"></textarea></div>
      <p class="rsub" style="white-space:normal">Nomes de coluna aceitos: link ou url · curtidas ou likes · comentarios ou comments · salvamentos ou saves · compartilhamentos ou shares · alcance ou reach · visualizacoes ou views.</p>`,
    rodape:`<button class="btn" data-ok>Aplicar aos posts</button><button class="btn sec" data-no>Cancelar</button>`,

        [...S.posts.entries()].forEach(([id,p])=>{

        });

          const id=mapa.get(idDoLink(r.link));
          if(!id){fora++;continue}
          const atual=S.posts.get(id);
          await patchPost(id,{stats:{...(atual.stats||{}),...r.stats},statsAt:new Date().toISOString()});
          ok++;

function parseInsights(txt){
  const alias={link:'link',url:'link',permalink:'link',post:'link',
    curtidas:'likes',likes:'likes',
    comentarios:'comments',comments:'comments',
    salvamentos:'saves',salvos:'saves',saves:'saves',saved:'saves',
    compartilhamentos:'shares',shares:'shares',
    alcance:'reach',reach:'reach',
    visualizacoes:'views',views:'views',impressoes:'views',impressions:'views'};
  const limpa=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z_]/g,'');
  const numero=v=>{const n=Number(String(v==null?'':v).replace(/[^0-9]/g,''));return isNaN(n)?0:n};
  const out=[];
  const empacota=o=>{
    const r={link:'',stats:{}};
    for(const k in o){
      const a=alias[limpa(k)];
      if(!a)continue;
      if(a==='link')r.link=String(o[k]||'').trim();
      else r.stats[a]=numero(o[k]);
    }
    if(r.link)out.push(r);
  };
  if(txt[0]==='['||txt[0]==='{'){
    const j=JSON.parse(txt);
    (Array.isArray(j)?j:[j]).forEach(empacota);
    return out;
  }
  const linhas=txt.split(/\r?\n/).filter(l=>l.trim());
  const sep=(linhas[0].match(/;/g)||[]).length>(linhas[0].match(/,/g)||[]).length?';':',';
  const cab=linhas[0].split(sep).map(h=>h.replace(/^"|"$/g,''));
  linhas.slice(1).forEach(l=>{
    const c=l.split(sep).map(x=>x.replace(/^"|"$/g,''));
    const o={};cab.forEach((h,i)=>o[h]=c[i]);
    empacota(o);
  });
  return out;
}

  const brief=[i.note,i.ref?'Referência: '+i.ref:''].filter(Boolean).join('\n\n');
  abrirPost(null,{},{
    title:i.title,brief,col:(S.board.columns[0]||{}).id||null,cat:null,
    tags:[...(i.tags||[])],people:[],perfil:i.perfil||null,plats:[],forms:[],
    date:data||'',time:'',channel:'',link:/^https?:\/\//i.test(i.ref||'')?i.ref:'',
    cover:null,checks:[],archived:false,order:Date.now()%1e7,
    createdAt:new Date().toISOString(),createdBy:S.me.id||null,_idea:id
  });
}

/* =========================================================
   Importar calendário da empresa (.ics ou .csv)
   ========================================================= */
function csvLinhas(txt){
  const out=[];let f='',row=[],q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){
      if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}
      else f+=c;
    }
    else if(c==='"')q=true;
    else if(c===','||c===';'||c==='\t'){row.push(f);f=''}
    else if(c==='\n'){row.push(f);f='';out.push(row);row=[]}
    else if(c!=='\r')f+=c;
  }
  if(f!==''||row.length){row.push(f);out.push(row)}
  return out.filter(r=>r.some(x=>String(x).trim()));
}
function limparChave(s){return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function parseData(s,br){
  s=String(s||'').trim();if(!s)return '';
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){
    let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;
    let d,mo;
    if(a>12){d=a;mo=b}else if(b>12){d=b;mo=a}else if(br){d=a;mo=b}else{d=b;mo=a}
    if(mo<1||mo>12||d<1||d>31)return '';
    return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  }
  return '';
}
function icsData(v){
  const m=String(v).match(/(\d{4})(\d{2})(\d{2})/);
  return m?m[1]+'-'+m[2]+'-'+m[3]:'';
}
function menosUmDia(iso){
  if(!iso)return '';
  const d=dOf(iso);d.setDate(d.getDate()-1);return isoOf(d);
}
function parseICS(txt){
  const linhas=txt.replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'').split('\n');
  const un=s=>String(s).replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1').trim();
  const evs=[];let cur=null;
  for(const l of linhas){
    if(/^BEGIN:VEVENT/i.test(l)){cur={};continue}
    if(/^END:VEVENT/i.test(l)){if(cur&&cur.title&&cur.date)evs.push(cur);cur=null;continue}
    if(!cur)continue;
    const i=l.indexOf(':');if(i<0)continue;
    const bruto=l.slice(0,i),v=l.slice(i+1),nome=bruto.split(';')[0].toUpperCase();
    if(nome==='SUMMARY')cur.title=un(v).slice(0,140);
    else if(nome==='DESCRIPTION')cur.notes=un(v).slice(0,400);
    else if(nome==='LOCATION'&&!cur.notes)cur.notes=un(v).slice(0,400);
    else if(nome==='DTSTART'){cur.date=icsData(v);cur.diaInteiro=!/T\d{2}/.test(v)}
    else if(nome==='DTEND')cur.fim={iso:icsData(v),diaInteiro:!/T\d{2}/.test(v)};
  }
  return evs.map(e=>{
    let end='';
    if(e.fim&&e.fim.iso){
      end=(e.diaInteiro&&e.fim.diaInteiro)?menosUmDia(e.fim.iso):e.fim.iso;
      if(end<=e.date)end='';
    }
    return{title:e.title,date:e.date,end,notes:e.notes||''};
  });
}
function parseCSVEventos(txt,br){
  const rows=csvLinhas(txt);
  if(rows.length<2)return [];
  const cab=rows[0].map(limparChave);
  const acha=(...alt)=>cab.findIndex(h=>alt.some(a=>h===a||h.includes(a)));
  const iT=acha('subject','titulo','title','assunto','evento','nome','resumo');
  const iI=acha('start date','inicio','data inicio','data','start','begin');
  const iF=acha('end date','fim','data fim','termino','end');
  const iD=acha('description','observacoes','obs','descricao','notes','detalhes');
  if(iT<0||iI<0)return [];
  return rows.slice(1).map(r=>{
    const date=parseData(r[iI],br);
    let end=iF>=0?parseData(r[iF],br):'';
    if(end&&end<=date)end='';
    return{title:String(r[iT]||'').trim().slice(0,140),date,end,notes:iD>=0?String(r[iD]||'').trim().slice(0,400):''};
  }).filter(e=>e.title&&e.date);
}
function importarEventos(){
  let achados=[],cor=PAL[3],origem='';
  abrirFolha({titulo:'Importar calendário da empresa',
    corpo:`<p class="rsub" style="white-space:normal">No Google Agenda: Configurações › Importar e exportar › Exportar (sai um .zip com um .ics por agenda). No Outlook, salve como .ics. Solte o arquivo aqui — também aceita .csv de planilha.</p>
      <div class="dropzone" id="dzev">Clique para escolher o arquivo, ou arraste o .ics / .csv aqui</div>
      <div><label class="f" for="txev">Ou cole o conteúdo</label>
        <textarea class="inp" id="txev" style="min-height:104px;font-family:ui-monospace,monospace;font-size:12px" placeholder="titulo,inicio,fim,observacoes"></textarea></div>
      <label class="chk"><input type="checkbox" id="brev" checked> Datas em dia/mês/ano — desmarque se o arquivo vier em mês/dia/ano</label>
      <div><label class="f">Cor no calendário</label><div class="cover-pick" id="corev">${PAL.map(c=>`<button class="sw" data-c="${c}" style="background:${c};${c===cor?'outline:2px solid var(--text);outline-offset:1px':''}"></button>`).join('')}</div></div>
      <div id="prev"></div>`,
    rodape:`<button class="btn" data-ok disabled>Importar</button><button class="btn sec" data-no>Cancelar</button>`,
    ligar:(el,fechar)=>{
      const ok=$('[data-ok]',el),prev=$('#prev',el),dz=$('#dzev',el);
      const analisar=txt=>{
        const br=$('#brev',el).checked;
        txt=String(txt||'');
        let achou=/BEGIN:VEVENT/i.test(txt)?parseICS(txt):parseCSVEventos(txt,br);
        const jaTem=new Set([...S.events.values()].map(e=>limparChave(e.title)+'|'+e.date));
        const novos=achou.filter(e=>!jaTem.has(limparChave(e.title)+'|'+e.date));
        const repetidos=achou.length-novos.length;
        achados=novos.slice(0,300);
        if(!txt.trim()){prev.innerHTML='';ok.disabled=true;return}
        if(!achados.length){
          prev.innerHTML=`<p class="rsub" style="white-space:normal">${repetidos?repetidos+' evento(s) do arquivo já estão aqui — nada novo para importar.':'Não reconheci eventos nesse conteúdo. Num CSV, precisa de uma coluna de título e uma de data inicial.'}</p>`;
          ok.disabled=true;return;
        }
        prev.innerHTML=`<label class="f">${achados.length} evento(s) para importar${repetidos?' · '+repetidos+' já existiam e serão ignorados':''}${origem?' · de '+esc(origem):''}</label>
          <div class="rows" style="max-height:210px;overflow:auto">${achados.slice(0,40).map(e=>`<div class="row" style="grid-template-columns:minmax(0,1fr) minmax(0,116px)">
            <div><div class="rt">${esc(e.title)}</div>${e.notes?`<div class="rsub">${esc(e.notes)}</div>`:''}</div>
            <span class="rsub">${fmtCurto(e.date)}${e.end?' – '+fmtCurto(e.end):''}</span></div>`).join('')}</div>
          ${achados.length>40?`<p class="rsub">…e outros ${achados.length-40}.</p>`:''}`;
        ok.disabled=false;
      };
      const lerArquivo=f=>{
        if(!f)return;
        origem=f.name;
        const r=new FileReader();
        r.onload=()=>{const t=String(r.result).slice(0,500000);$('#txev',el).value=t.length>4000?'(arquivo carregado: '+f.name+')':t;analisar(t)};
        r.onerror=()=>aviso('Não consegui ler esse arquivo.');
        r.readAsText(f);
      };
      dz.onclick=()=>{
        const inp=document.createElement('input');inp.type='file';
        inp.accept='.ics,.csv,.txt,text/calendar,text/csv,text/plain';
        inp.onchange=()=>lerArquivo(inp.files[0]);inp.click();
      };
      ['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('hot')}));
      ['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('hot')}));
      dz.addEventListener('drop',e=>lerArquivo(e.dataTransfer&&e.dataTransfer.files[0]));
      $('#txev',el).oninput=e=>{origem='';analisar(e.target.value)};
      $('#brev',el).onchange=()=>analisar($('#txev',el).value);
      $$('[data-c]',el).forEach(b=>b.onclick=()=>{
        cor=b.dataset.c;
        $$('[data-c]',el).forEach(x=>x.style.outline='');
        b.style.outline='2px solid var(--text)';b.style.outlineOffset='1px';
      });
      $('[data-no]',el).onclick=fechar;
      ok.onclick=async()=>{
        ok.disabled=true;ok.textContent='importando…';
        const total=achados.length;
        for(const e of achados)await putEvento(nid(),{title:e.title,date:e.date,end:e.end||'',color:cor,notes:e.notes||'',importado:true});
        fechar();
        aviso(total+' evento(s) no calendário da empresa.');
      };
    }});
}
async function modeloEventos(){
  const csv=['titulo,inicio,fim,observacoes',
    'Lancamento turma 12,05/10/2026,09/10/2026,Semana de vendas',
    'Feriado,12/10/2026,,Sem publicacao',
