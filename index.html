function viewTax(root){
  const linha=(item,tipo)=>`<div class="tag-row">
      <button class="sw" style="background:${esc(item.color)}" data-cor="${tipo}:${item.id}" title="Trocar cor"></button>
      <span style="flex:1;font-weight:500">${esc(item.name)}</span>
      <span class="rsub">${usoDe(tipo,item.id)}</span>
      ${S.canWrite?`<button class="col-menu" data-ren="${tipo}:${item.id}" title="Renomear">✎</button>
      <button class="col-menu" data-del="${tipo}:${item.id}" title="Excluir">×</button>`:''}
    </div>`;
  const grupo=(tit,dica,tipo,arr,btn)=>`<div class="panel">
      <h3>${tit}</h3><p class="hint">${dica}</p>
      ${arr.length?arr.map(i=>linha(i,tipo)).join(''):`<p class="rsub">Nada criado ainda.</p>`}
      ${S.canWrite?`<button class="btn sec" style="margin-top:12px" data-add="${tipo}">+ ${btn}</button>`:''}
    </div>`;
  root.innerHTML=
    grupo('Perfis','Cada conta ou marca que vocês produzem. O seletor no topo filtra o board, o calendário e o banco por perfil.','perf',S.board.perfis||[],'Novo perfil')+
    grupo('Plataformas','Onde a peça é publicada. Aparece como checklist no post — marque quantas quiser.','plat',S.board.plataformas||[],'Nova plataforma')+
    grupo('Formatos','Reels, carrossel, estático, story… também em checklist, para não digitar nada.','form',S.board.formatos||[],'Novo formato')+
    grupo('Colunas do kanban','A ordem aqui é a ordem no board. Excluir uma coluna move os posts dela para a primeira.','col',S.board.columns,'Nova coluna')+
    grupo('Categorias','Uma por post — o tipo de conteúdo ou a linha editorial (institucional, venda, bastidor, educativo).','cat',S.board.cats,'Nova categoria')+
    grupo('Tags','Várias por post, para cruzar assuntos: campanha, produto, persona, formato.','tag',S.board.tags,'Nova tag');
  $$('[data-add]',root).forEach(b=>b.onclick=()=>addTax(b.dataset.add));
  $$('[data-ren]',root).forEach(b=>b.onclick=()=>renomearTax(b.dataset.ren));
  $$('[data-del]',root).forEach(b=>b.onclick=()=>excluirTax(b.dataset.del));
  $$('[data-cor]',root).forEach(b=>b.onclick=()=>trocarCor(b.dataset.cor));
}
function usoDe(tipo,id){
  const all=[...S.posts.values()];
  const n=tipo==='col'?all.filter(p=>p.col===id).length
        :tipo==='cat'?all.filter(p=>p.cat===id).length
        :tipo==='perf'?all.filter(p=>p.perfil===id).length
        :tipo==='plat'?all.filter(p=>(p.plats||[]).includes(id)).length
        :tipo==='form'?all.filter(p=>(p.forms||[]).includes(id)).length
        :all.filter(p=>(p.tags||[]).includes(id)).length;
  return n+(n===1?' post':' posts');
}
const chaveDe=t=>({col:'columns',cat:'cats',perf:'perfis',plat:'plataformas',form:'formatos'}[t]||'tags');
async function addTax(tipo){
  const r=await pedirNome({titulo:tipo==='col'?'Nova coluna':tipo==='cat'?'Nova categoria':tipo==='perf'?'Novo perfil':tipo==='plat'?'Nova plataforma':tipo==='form'?'Novo formato':'Nova tag',cor:true});
  if(!r)return;
  const k=chaveDe(tipo);
  saveBoard({...S.board,[k]:[...S.board[k],{id:nid(),name:r.nome,color:r.cor}]});
}
async function renomearTax(ref){
  const[tipo,id]=ref.split(':'),k=chaveDe(tipo);
  const it=S.board[k].find(x=>x.id===id);if(!it)return;
  const r=await pedirNome({titulo:'Renomear',valor:it.name});
  if(!r)return;
  saveBoard({...S.board,[k]:S.board[k].map(x=>x.id===id?{...x,name:r.nome}:x)});
}
async function trocarCor(ref){
  const[tipo,id]=ref.split(':'),k=chaveDe(tipo);
  const it=S.board[k].find(x=>x.id===id);if(!it||!S.canWrite)return;
  const cor=await pedirCor(it.color);
  if(!cor)return;
  saveBoard({...S.board,[k]:S.board[k].map(x=>x.id===id?{...x,color:cor}:x)});
}
async function excluirTax(ref){
  const[tipo,id]=ref.split(':'),k=chaveDe(tipo);
  const it=S.board[k].find(x=>x.id===id);if(!it)return;
  const ok=await confirmar(`Excluir “${it.name}”?`,tipo==='col'?'Os posts desta coluna vão para a primeira coluna do board.':'Os posts continuam existindo, apenas sem esta marcação.');
  if(!ok)return;
  const resto=S.board[k].filter(x=>x.id!==id);
  if(tipo==='col'){
    const destino=(resto[0]||{}).id||null;
    for(const[pid,p]of[...S.posts.entries()])if(p.col===id)await patchPost(pid,{col:destino});
  }else if(tipo==='cat'){
    for(const[pid,p]of[...S.posts.entries()])if(p.cat===id)await patchPost(pid,{cat:null});
  }else if(tipo==='perf'){
    for(const[pid,p]of[...S.posts.entries()])if(p.perfil===id)await patchPost(pid,{perfil:null});
    S.filters.perfis=S.filters.perfis.filter(x=>x!==id);
  }else if(tipo==='plat'||tipo==='form'){
    const campo=tipo==='plat'?'plats':'forms';
    for(const[pid,p]of[...S.posts.entries()])if((p[campo]||[]).includes(id))await patchPost(pid,{[campo]:p[campo].filter(x=>x!==id)});
    S.filters[campo]=S.filters[campo].filter(x=>x!==id);
  }else{
    for(const[pid,p]of[...S.posts.entries()])if((p.tags||[]).includes(id))await patchPost(pid,{tags:p.tags.filter(t=>t!==id)});
  }
  saveBoard({...S.board,[k]:resto});
}
async function novaColuna(){return addTax('col')}
async function menuColuna(id){
  const c=acharCol(id);if(!c)return;
  abrirFolha({titulo:esc(c.name),narrow:true,corpo:`
    <button class="btn sec" data-a="ren" style="width:100%;justify-content:flex-start">✎ Renomear coluna</button>
    <button class="btn sec" data-a="cor" style="width:100%;justify-content:flex-start">◑ Trocar cor</button>
    <button class="btn sec" data-a="esq" style="width:100%;justify-content:flex-start">← Mover para a esquerda</button>
    <button class="btn sec" data-a="dir" style="width:100%;justify-content:flex-start">→ Mover para a direita</button>
    <button class="danger" data-a="del" style="text-align:left">Excluir coluna</button>`,
    ligar:(el,fechar)=>{
      const mover=dir=>{
        const cols=[...S.board.columns],i=cols.findIndex(x=>x.id===id),j=i+dir;
        if(j<0||j>=cols.length)return;
        [cols[i],cols[j]]=[cols[j],cols[i]];saveBoard({...S.board,columns:cols});
      };
      $('[data-a="ren"]',el).onclick=()=>{fechar();renomearTax('col:'+id)};
      $('[data-a="cor"]',el).onclick=()=>{fechar();trocarCor('col:'+id)};
      $('[data-a="esq"]',el).onclick=()=>{fechar();mover(-1)};
      $('[data-a="dir"]',el).onclick=()=>{fechar();mover(1)};
      $('[data-a="del"]',el).onclick=()=>{fechar();excluirTax('col:'+id)};
    }});
}

/* =========================================================
   Folhas (modais)
   ========================================================= */
let fecharAtual=null;
function abrirFolha({titulo,corpo,rodape,ligar,narrow}){
  fechaFolha();
  const host=$('#sheetHost');
  host.innerHTML=`<div class="sheet ${narrow?'narrow':''}" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="sh-h"><h2>${titulo}</h2><button class="x" data-close aria-label="Fechar">×</button></div>
    <div class="sh-b">${corpo}</div>
    ${rodape?`<div class="sh-f">${rodape}</div>`:''}
  </div>`;
  $('#scrim').classList.add('on');
  const el=$('.sheet',host);
  const fechar=()=>fechaFolha();
  $('[data-close]',el).onclick=fechar;
  fecharAtual=fechar;
  if(ligar)ligar(el,fechar);
  const f=el.querySelector('input,textarea,select');if(f&&window.innerWidth>860)f.focus();
  return{el,fechar};
}
function fechaFolha(){
  $('#sheetHost').innerHTML='';
  $('#scrim').classList.remove('on');
  $('#sidebar').classList.remove('open');
  fecharAtual=null;
}
function pedirNome({titulo,valor='',cor=false}){
  return new Promise(res=>{
    let escolhida=PAL[Math.floor(Math.random()*PAL.length)];
    const{el,fechar}=abrirFolha({titulo,narrow:true,
      corpo:`<div><label class="f" for="pn">Nome</label><input class="inp" id="pn" value="${esc(valor)}" maxlength="42" placeholder="Ex.: Campanha de aniversário"></div>
        ${cor?`<div><label class="f">Cor</label><div class="cover-pick" id="pc">${PAL.map(c=>`<button class="sw" data-c="${c}" style="background:${c};${c===escolhida?'outline:2px solid var(--text);outline-offset:1px':''}"></button>`).join('')}</div></div>`:''}`,
      rodape:`<button class="btn" data-ok>Salvar</button><button class="btn sec" data-close2>Cancelar</button>`,
      ligar:(el,fechar)=>{
        const inp=$('#pn',el);
        const ok=()=>{const n=inp.value.trim();if(!n){inp.focus();return}fechar();res({nome:n,cor:escolhida})};
        $('[data-ok]',el).onclick=ok;
        $('[data-close2]',el).onclick=()=>{fechar();res(null)};
        inp.onkeydown=e=>{if(e.key==='Enter')ok()};
        $$('[data-c]',el).forEach(b=>b.onclick=()=>{escolhida=b.dataset.c;$$('[data-c]',el).forEach(x=>x.style.outline='');b.style.outline='2px solid var(--text)';b.style.outlineOffset='1px'});
      }});
    el.addEventListener('vde:cancel',()=>res(null));
  });
}
function pedirCor(atual){
  return new Promise(res=>{
    const{el}=abrirFolha({titulo:'Escolher cor',narrow:true,
      corpo:`<div class="cover-pick">${PAL.map(c=>`<button class="sw" data-c="${c}" style="background:${c};width:38px;height:30px;${c===atual?'outline:2px solid var(--text);outline-offset:1px':''}"></button>`).join('')}</div>`,
      ligar:(el,fechar)=>{$$('[data-c]',el).forEach(b=>b.onclick=()=>{fechar();res(b.dataset.c)})}});
    el.addEventListener('vde:cancel',()=>res(null));
  });
}
function pedirData(atual){
  return new Promise(res=>{
    const{el}=abrirFolha({titulo:'Mudar a data',narrow:true,
      corpo:`<div><label class="f" for="nd">Nova data de publicação</label><input class="inp" id="nd" type="date" value="${esc(atual||'')}"></div>`,
      rodape:`<button class="btn" data-ok>Mover</button><button class="btn sec" data-no>Cancelar</button>`,
      ligar:(el,fechar)=>{
        $('[data-ok]',el).onclick=()=>{const v=$('#nd',el).value;fechar();res(v||null)};
        $('[data-no]',el).onclick=()=>{fechar();res(null)};
      }});
    el.addEventListener('vde:cancel',()=>res(null));
  });
}
function confirmar(titulo,texto){
  return new Promise(res=>{
    const{el}=abrirFolha({titulo,narrow:true,corpo:`<p class="rsub" style="white-space:normal">${esc(texto||'')}</p>`,
      rodape:`<button class="btn" data-ok>Confirmar</button><button class="btn sec" data-no>Cancelar</button>`,
      ligar:(el,fechar)=>{
        $('[data-ok]',el).onclick=()=>{fechar();res(true)};
        $('[data-no]',el).onclick=()=>{fechar();res(false)};
      }});
    el.addEventListener('vde:cancel',()=>res(false));
  });
}

/* =========================================================
   Editor de post
   ========================================================= */
function abrirPost(id,base,rascunho){
  const existente=id?S.posts.get(id):null;
  if(id&&!existente&&!rascunho)return;
  const p=rascunho?rascunho:existente?JSON.parse(JSON.stringify(existente)):{
    title:'',brief:'',col:(base&&base.col)||(S.board.columns[0]||{}).id||null,cat:null,
    perfil:(base&&base.perfil)||S.filters.perfis[0]||null,tags:[],people:[],
    plats:[...S.filters.plats],forms:[...S.filters.forms],
    date:(base&&base.date)||'',time:'',channel:'',link:'',url:'',stats:{},cover:null,checks:[],archived:false,
    order:Date.now()%1e7,createdAt:new Date().toISOString(),createdBy:S.me.id||null
  };
  if(base&&base.date&&!p.date)p.date=base.date;
  const pid=id||nid();
  const ro=!S.canWrite;
  const perfis=S.board.perfis||[];
  let modo=S.modo,busca=[];

  const segs=()=>ro?'':`<div class="modo-bar">
    <div class="segs">
      <button data-m="rapido" aria-pressed="${modo==='rapido'}">Rápido</button>
      <button data-m="completo" aria-pressed="${modo==='completo'}">Completo</button>
    </div>
    <span>${modo==='rapido'?'só o essencial para entrar no board':'briefing, capa, responsáveis e checklist'}</span>
  </div>`;
  const selPerfil=()=>perfis.length?`<div><label class="f" for="pf">Perfil</label>
    <select class="sel" id="pf" ${ro?'disabled':''}><option value="">—</option>${perfis.map(x=>`<option value="${x.id}" ${p.perfil===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`:'';
  const selCol=()=>`<div><label class="f" for="col">Coluna</label>
    <select class="sel" id="col" ${ro?'disabled':''}>${S.board.columns.map(c=>`<option value="${c.id}" ${p.col===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`;
  const selCat=()=>`<div><label class="f" for="cat">Categoria</label>
    <select class="sel" id="cat" ${ro?'disabled':''}><option value="">—</option>${S.board.cats.map(c=>`<option value="${c.id}" ${p.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`;
  const dataHora=()=>`<div class="two">
    <div><label class="f" for="dt">Data de publicação</label><input class="inp" id="dt" type="date" value="${esc(p.date||'')}" ${ro?'disabled':''}></div>
    <div><label class="f" for="hr">Horário <span style="font-weight:400;color:var(--text-3)">opcional</span></label>
      <input class="inp" id="hr" value="${esc(p.time||'')}" list="horas" placeholder="18:00, 9h, manhã…" ${ro?'disabled':''}>
      <datalist id="horas">${HORAS.map(h=>`<option value="${h}">`).join('')}</datalist></div></div>`;
  const chkList=(lab,itens,sel,attr,vazio)=>`<div><label class="f">${lab}</label>
    ${itens.length?`<div class="chkgrid">${itens.map(x=>`<label class="chk"><input type="checkbox" data-${attr}="${x.id}" ${sel.includes(x.id)?'checked':''} ${ro?'disabled':''}><span><i class="dot" style="--c:${esc(x.color)}"></i>${esc(x.name)}</span></label>`).join('')}</div>`
      :`<p class="rsub">${vazio}</p>`}</div>`;
  const chkPlat=()=>chkList('Plataformas',S.board.plataformas||[],p.plats||[],'pl','Cadastre suas plataformas em Estrutura › Plataformas.');
  const chkForm=()=>chkList('Formato',S.board.formatos||[],p.forms||[],'fm','Cadastre reels, carrossel, estático… em Estrutura › Formatos.');
  const pickTags=()=>`<div><label class="f">Tags</label><div class="pick" id="tagpick">
    ${S.board.tags.map(t=>`<button data-t="${t.id}" style="--c:${esc(t.color)}" aria-pressed="${p.tags.includes(t.id)}" ${ro?'disabled':''}>${esc(t.name)}</button>`).join('')}
    ${ro?'':`<button data-newtag style="border-style:dashed">+ nova tag</button>`}</div></div>`;
  const titulo=()=>`<div><label class="f" for="t">Título do post</label>
    <input class="inp" id="t" value="${esc(p.title)}" placeholder="Ex.: Carrossel — 3 erros ao montar o método" ${ro?'disabled':''}></div>`;

  const corpo=()=>modo==='rapido'&&!ro?`
    ${segs()}
    ${titulo()}
    <div class="two">${selCol()}${perfis.length?selPerfil():selCat()}</div>
    ${dataHora()}
    ${chkPlat()}
    ${chkForm()}
    ${pickTags()}
    <p class="rsub">Briefing, responsáveis, capa e checklist ficam no modo completo — o post já fica salvo no banco assim mesmo.</p>`
  :`
    ${segs()}
    ${p.cover?(()=>{const c=coverStyle(p.cover);return `<div class="cover-prev ${c?c.cls:''}" style="${c?c.style:''}"></div>`})():''}
    ${titulo()}
    <div><label class="f" for="br">Briefing / roteiro</label>
      <textarea class="inp" id="br" placeholder="Ideia central, gancho, CTA, referências…" ${ro?'disabled':''}>${esc(p.brief||'')}</textarea></div>
    <div class="two">${selCol()}${selCat()}</div>
    ${perfis.length?selPerfil():''}
    ${chkPlat()}
    ${chkForm()}
    ${dataHora()}
    <div><label class="f" for="lk">Link do material</label><input class="inp" id="lk" value="${esc(p.link||'')}" placeholder="Drive, Notion, Canva…" ${ro?'disabled':''}></div>
    ${pickTags()}
    <div>
      <label class="f" for="url">Link do post publicado ${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-weight:600">abrir ↗</a>`:''}</label>
      <input class="inp" id="url" value="${esc(p.url||'')}" placeholder="https://www.instagram.com/p/…" ${ro?'disabled':''}>
    </div>
    <div><label class="f">Resultados ${p.statsAt?`<span style="font-weight:400;color:var(--text-3)">atualizados em ${esc(fmtCurto(p.statsAt.slice(0,10)))}</span>`:''}</label>
      <div class="statgrid">
        ${METRICAS.map(([k,rot])=>`<div><label class="f" for="s-${k}">${rot}</label>
          <input class="inp" id="s-${k}" inputmode="numeric" value="${esc((p.stats||{})[k]||'')}" placeholder="0" ${ro?'disabled':''}></div>`).join('')}
      </div>
      ${(()=>{const e=engaj(p.stats);return e!=null?`<p class="rsub" style="margin:8px 0 0">Engajamento: <b style="color:var(--text)">${(e*100).toFixed(1).replace('.',',')}%</b> sobre o alcance</p>`:''})()}
    </div>
    <div><label class="f">Responsáveis</label>
      <div class="who-pick" id="whopick">
        ${p.people.map(u=>`<span class="who-chip">${avatar(u)}${esc(nome(u))}${ro?'':`<button data-rmu="${u}">×</button>`}</span>`).join('')}
        ${ro?'':`<button class="btn sec" id="addu" style="height:28px;padding:0 10px">+ Adicionar</button>`}
      </div>
      <div id="userbox"></div></div>
    <div><label class="f">Capa</label>
      ${ro?'':`<div class="dropzone" id="dz" style="margin-bottom:9px">Cole a imagem do post com Ctrl+V ou arraste o arquivo aqui</div>`}
      <div class="cover-pick">
        ${PAL.map(c=>`<button class="sw" data-cv="${c}" style="background:linear-gradient(120deg,${c},${c}88)" ${ro?'disabled':''}></button>`).join('')}
        ${ro?'':`<button class="btn sec" id="upl" style="height:28px;padding:0 10px">↥ Imagem</button>`}
        ${p.cover&&!ro?`<button class="btn sec" id="rmcv" style="height:28px;padding:0 10px">Remover</button>`:''}
      </div></div>
    <div><label class="f">Checklist</label><div id="chks">
      ${(p.checks||[]).map((c,i)=>`<div class="chk"><input type="checkbox" data-ck="${i}" ${c.d?'checked':''} ${ro?'disabled':''}>${c.d?`<s>${esc(c.t)}</s>`:esc(c.t)}${ro?'':`<button data-rmck="${i}">×</button>`}</div>`).join('')}
      ${ro?'':`<div class="chk"><input class="inp" id="newck" placeholder="+ nova etapa (Enter)" style="border:0;background:none;padding:4px 0"></div>`}
    </div></div>`;

  abrirFolha({
    titulo:id?'Editar post':p._idea?'Agendar ideia':'Novo post',
    corpo:corpo(),
    rodape:ro?`<span class="rsub">Acesso somente leitura</span>`
      :`<button class="btn" data-save>Salvar post</button>
        <button class="btn sec" data-close2>Cancelar</button>
        ${id?`<button class="danger" data-arq style="margin-left:auto">${p.archived?'Desarquivar':'Arquivar'}</button><button class="danger" data-del>Excluir</button>`:''}`,
    ligar:(el,fechar)=>{
      const val=k=>{const e=$('#'+k,el);return e?e.value:null};
      const coletar=()=>{
        const set=(campo,k,tr)=>{const v=val(k);if(v!==null)p[campo]=tr?tr(v):v};
        set('title','t',s=>s.trim());set('brief','br');
        set('col','col',v=>v||null);set('cat','cat',v=>v||null);set('perfil','pf',v=>v||null);
        set('date','dt');set('time','hr');
        set('channel','cn',s=>s.trim());set('link','lk',s=>s.trim());set('url','url',s=>s.trim());
        if($('#s-likes',el)){
          const st={...(p.stats||{})};
          METRICAS.forEach(([k])=>{
            const e=$('#s-'+k,el);if(!e)return;
            const n=Number(String(e.value).replace(/[^0-9]/g,''));
            if(String(e.value).trim()==='')delete st[k];else st[k]=isNaN(n)?0:n;
          });
          const mudou=JSON.stringify(st)!==JSON.stringify(p.stats||{});
          p.stats=st;
          if(mudou&&temStats(st))p.statsAt=new Date().toISOString();
        }
      };
      const redesenhar=()=>{$('.sh-b',el).innerHTML=corpo();ligarCorpo()};
      function ligarCorpo(){
        if(ro)return;
        $$('[data-m]',el).forEach(b=>b.onclick=()=>{
          coletar();modo=b.dataset.m;S.modo=modo;store('modo',modo);redesenhar();
        });
        $$('[data-t]',el).forEach(b=>b.onclick=()=>{
          const t=b.dataset.t;
          p.tags=p.tags.includes(t)?p.tags.filter(x=>x!==t):[...p.tags,t];
          b.setAttribute('aria-pressed',p.tags.includes(t));
        });
        const nt=$('[data-newtag]',el);
        if(nt)nt.onclick=async()=>{
          coletar();
          const r=await pedirNome({titulo:'Nova tag',cor:true});
          if(!r)return;
          const t={id:nid(),name:r.nome,color:r.cor};
          p.tags=[...p.tags,t.id];
          await saveBoard({...S.board,tags:[...S.board.tags,t]});
          abrirPost(id,base,p);
        };
        const marcar=(campo,attr)=>$$('['+attr+']',el).forEach(b=>b.onchange=()=>{
          const v=b.getAttribute(attr),atual=p[campo]||[];
          p[campo]=b.checked?[...new Set([...atual,v])]:atual.filter(x=>x!==v);
        });
        marcar('plats','data-pl');marcar('forms','data-fm');
        $$('[data-rmu]',el).forEach(b=>b.onclick=()=>{coletar();p.people=p.people.filter(u=>u!==b.dataset.rmu);redesenhar()});
        const au=$('#addu',el);
        if(au)au.onclick=async()=>{
          const box=$('#userbox',el);
          box.innerHTML=`<input class="inp" id="us" placeholder="Buscar pessoa na equipe…" style="margin-top:7px"><div class="res" id="rl"></div>`;
          const inp=$('#us',el);inp.focus();
          const mostrar=hits=>{
            busca=hits;
            $('#rl',el).innerHTML=hits.length?hits.map(h=>`<button data-u="${esc(h.id)}"><img src="${esc(h.avatarUrl)}" alt="">${esc(h.name)}</button>`).join('')
              :`<div style="padding:9px 10px" class="rsub">Ninguém encontrado. Convide a pessoa ao artifact para poder atribuir.</div>`;
            $$('[data-u]',el).forEach(b=>b.onclick=()=>{
              const h=busca.find(x=>x.id===b.dataset.u);
              if(h){S.profiles[h.id]=h;if(!p.people.includes(h.id))p.people.push(h.id)}
              coletar();box.innerHTML='';redesenhar();
            });
          };
          if(!S.user){mostrar([]);return}
          mostrar(await S.user.search(''));
          inp.oninput=async()=>mostrar(await S.user.search(inp.value));
        };
        $$('[data-cv]',el).forEach(b=>b.onclick=()=>{coletar();p.cover={type:'grad',c1:b.dataset.cv,c2:b.dataset.cv+'99'};redesenhar()});
        const rm=$('#rmcv',el);if(rm)rm.onclick=()=>{coletar();p.cover=null;redesenhar()};
        const enviarCapa=async file=>{
          if(!file||!/^image\//.test(file.type||''))return;
          if(!S.assets){aviso('Upload de imagem disponível para quem pode editar o artifact.');return}
          if(file.size>20*1024*1024){aviso('Imagem acima de 20 MB.');return}
          const dz=$('#dz',el);if(dz)dz.textContent='enviando imagem…';
          try{
            const r=await S.assets.upload(file);
            coletar();p.cover={type:'img',asset:r.id};redesenhar();aviso('Capa atualizada.');
          }catch(e){aviso('Não foi possível enviar a imagem.');if(dz)dz.textContent='Cole a imagem do post com Ctrl+V ou arraste o arquivo aqui'}
        };
        const up=$('#upl',el);
        if(up)up.onclick=()=>{
          const f=document.createElement('input');f.type='file';f.accept='image/png,image/jpeg,image/webp,image/gif';
          f.onchange=()=>enviarCapa(f.files[0]);
          f.click();
        };
        el.onpaste=ev=>{
          const it=[...((ev.clipboardData||{}).items||[])].find(x=>/^image\//.test(x.type||''));
          if(!it)return;
          ev.preventDefault();enviarCapa(it.getAsFile());
        };
        const dz=$('#dz',el);
        if(dz){
          dz.onclick=()=>{const u=$('#upl',el);if(u)u.click()};
          ['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('hot')}));
          ['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('hot')}));
          dz.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)enviarCapa(f)});
        }
        $$('[data-ck]',el).forEach(b=>b.onchange=()=>{coletar();const i=+b.dataset.ck;p.checks[i].d=b.checked;redesenhar()});
        $$('[data-rmck]',el).forEach(b=>b.onclick=()=>{coletar();p.checks.splice(+b.dataset.rmck,1);redesenhar()});
        const nc=$('#newck',el);
        if(nc)nc.onkeydown=e=>{
          if(e.key!=='Enter')return;
          const v=nc.value.trim();if(!v)return;
          coletar();p.checks=[...(p.checks||[]),{t:v,d:false}];redesenhar();
          setTimeout(()=>{const n=$('#newck',el);if(n)n.focus()},10);
        };
      }
      ligarCorpo();
      const sv=$('[data-save]',el);
      if(sv)sv.onclick=()=>{
        coletar();
        if(!p.title){$('#t',el).focus();aviso('Dê um título ao post.');return}
        if(!p.col)p.col=(S.board.columns[0]||{}).id||null;
        const dados={...p},ideia=dados._idea;delete dados._idea;
        putPost(pid,dados);
        if(ideia)patchIdeia(ideia,{scheduledPostId:pid});
        fechar();
        aviso(ideia?'Ideia agendada e no board.':id?'Post atualizado.':'Post criado e disponível no banco de postagens.');
      };
      const cl=$('[data-close2]',el);if(cl)cl.onclick=fechar;
      const ar=$('[data-arq]',el);
      if(ar)ar.onclick=()=>{coletar();putPost(pid,{...p,archived:!p.archived});fechar();aviso(p.archived?'Post desarquivado.':'Post arquivado — segue no banco, com filtro.')};
      const dl=$('[data-del]',el);
      if(dl)dl.onclick=async()=>{
        const ok=await confirmar('Excluir este post?','A ação não pode ser desfeita. Se quiser manter o histórico, arquive.');
        if(ok){delPost(pid);fechaFolha()}else abrirPost(id,base);
      };
    }});
  resolverPerfis(p.people);
}

/* ---------- editor de acontecimento ---------- */
function abrirEvento(id){
  const ex=id?S.events.get(id):null;
  const e=ex?{...ex}:{title:'',date:HOJE,end:'',color:PAL[4],notes:''};
  const eid=id||nid();
  const ro=!S.canWrite;
  let cor=e.color;
  abrirFolha({titulo:id?'Evento da empresa':'Novo evento',narrow:true,
    corpo:`<div><label class="f" for="et">Evento</label><input class="inp" id="et" value="${esc(e.title)}" placeholder="Ex.: Lançamento da turma 12" ${ro?'disabled':''}></div>
      <div class="two"><div><label class="f" for="ed">Início</label><input class="inp" id="ed" type="date" value="${esc(e.date)}" ${ro?'disabled':''}></div>
      <div><label class="f" for="ee">Fim (opcional)</label><input class="inp" id="ee" type="date" value="${esc(e.end||'')}" ${ro?'disabled':''}></div></div>
      <div><label class="f">Cor no calendário</label><div class="cover-pick" id="ec">${PAL.map(c=>`<button class="sw" data-c="${c}" style="background:${c};${c===cor?'outline:2px solid var(--text);outline-offset:1px':''}" ${ro?'disabled':''}></button>`).join('')}</div></div>
      <div><label class="f" for="en">Observações</label><textarea class="inp" id="en" placeholder="Contexto, metas, quem participa…" ${ro?'disabled':''}>${esc(e.notes||'')}</textarea></div>`,
    rodape:ro?'':`<button class="btn" data-ok>Salvar</button><button class="btn sec" data-no>Cancelar</button>${id?`<button class="danger" data-del style="margin-left:auto">Excluir</button>`:''}`,
    ligar:(el,fechar)=>{
      $$('[data-c]',el).forEach(b=>b.onclick=()=>{cor=b.dataset.c;$$('[data-c]',el).forEach(x=>x.style.outline='');b.style.outline='2px solid var(--text)';b.style.outlineOffset='1px'});
      const ok=$('[data-ok]',el);
      if(ok)ok.onclick=()=>{
        const t=$('#et',el).value.trim();if(!t){$('#et',el).focus();return}
        const d=$('#ed',el).value||HOJE,f=$('#ee',el).value;
        putEvento(eid,{title:t,date:d,end:f&&f>=d?f:'',color:cor,notes:$('#en',el).value.trim()});
        fechar();
      };
      const no=$('[data-no]',el);if(no)no.onclick=fechar;
      const dl=$('[data-del]',el);
      if(dl)dl.onclick=async()=>{const c=await confirmar('Excluir evento?','Ele deixa de aparecer no calendário de conteúdo.');if(c){delEvento(eid);fechaFolha()}};
    }});
}

/* =========================================================
   Painel de filtros (vale para kanban, calendário e banco)
   ========================================================= */
function painelFiltros(){
  const f=S.filters;
  const grupo=(tit,itens,sel,attr)=>`<div><label class="f">${tit}</label><div class="pick">
    ${itens.length?itens.map(i=>`<button data-${attr}="${i.id}" style="--c:${esc(i.color||'#4b5161')}" aria-pressed="${sel.includes(i.id)}">${esc(i.name)}</button>`).join(''):`<span class="rsub">Nada criado ainda.</span>`}</div></div>`;
  const pessoas=[...new Set([...S.posts.values()].flatMap(p=>p.people||[]))];
  abrirFolha({titulo:'Filtros',narrow:true,
    corpo:`<div><label class="f" for="fq2">Busca no texto</label><input class="inp" id="fq2" value="${esc(f.q)}" placeholder="Título, briefing, canal, link…"></div>
      ${grupo('Perfis',S.board.perfis||[],f.perfis,'fpf')}
      ${grupo('Plataformas',S.board.plataformas||[],f.plats,'fpl')}
      ${grupo('Formatos',S.board.formatos||[],f.forms,'ffo')}
      ${grupo('Colunas',S.board.columns,f.cols,'fc')}
      ${grupo('Categorias',S.board.cats,f.cats,'fk')}
      ${grupo('Tags',S.board.tags,f.tags,'ft')}
      <div><label class="f">Responsáveis</label><div class="pick">
        ${pessoas.length?pessoas.map(u=>`<button data-fp="${esc(u)}" aria-pressed="${f.people.includes(u)}">${esc(nome(u))}</button>`).join(''):`<span class="rsub">Nenhum responsável atribuído ainda.</span>`}</div></div>
      <div class="two"><div><label class="f" for="fd">Publicação de</label><input class="inp" id="fd" type="date" value="${esc(f.de)}"></div>
      <div><label class="f" for="fa">até</label><input class="inp" id="fa" type="date" value="${esc(f.ate)}"></div></div>
      <label class="chk"><input type="checkbox" id="fq" ${f.arq?'checked':''}> Incluir posts arquivados</label>`,
    rodape:`<button class="btn" data-ok>Aplicar</button><button class="btn sec" data-limpar>Limpar</button>`,
    ligar:(el,fechar)=>{
      const alt=(arr,v)=>arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];
      $$('[data-fpl]',el).forEach(b=>b.onclick=()=>{f.plats=alt(f.plats,b.dataset.fpl);b.setAttribute('aria-pressed',f.plats.includes(b.dataset.fpl))});
      $$('[data-ffo]',el).forEach(b=>b.onclick=()=>{f.forms=alt(f.forms,b.dataset.ffo);b.setAttribute('aria-pressed',f.forms.includes(b.dataset.ffo))});
      $$('[data-fpf]',el).forEach(b=>b.onclick=()=>{f.perfis=alt(f.perfis,b.dataset.fpf);b.setAttribute('aria-pressed',f.perfis.includes(b.dataset.fpf))});
      $$('[data-fc]',el).forEach(b=>b.onclick=()=>{f.cols=alt(f.cols,b.dataset.fc);b.setAttribute('aria-pressed',f.cols.includes(b.dataset.fc))});
      $$('[data-fk]',el).forEach(b=>b.onclick=()=>{f.cats=alt(f.cats,b.dataset.fk);b.setAttribute('aria-pressed',f.cats.includes(b.dataset.fk))});
      $$('[data-ft]',el).forEach(b=>b.onclick=()=>{f.tags=alt(f.tags,b.dataset.ft);b.setAttribute('aria-pressed',f.tags.includes(b.dataset.ft))});
      $$('[data-fp]',el).forEach(b=>b.onclick=()=>{f.people=alt(f.people,b.dataset.fp);b.setAttribute('aria-pressed',f.people.includes(b.dataset.fp))});
      $('[data-ok]',el).onclick=()=>{
        f.de=$('#fd',el).value;f.ate=$('#fa',el).value;f.arq=$('#fq',el).checked;
        f.q=$('#fq2',el).value;$('#q').value=f.q;
        fechar();render();
      };
      $('[data-limpar]',el).onclick=()=>{
        S.filters={q:'',tags:[],cats:[],people:[],cols:[],perfis:[],plats:[],forms:[],de:'',ate:'',arq:false};
        $('#q').value='';fechar();render();
      };
    }});
  resolverPerfis(pessoas);
}

/* =========================================================
   Exportação para o calendário da empresa
   ========================================================= */
function csvEscape(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function usDate(iso){const[y,m,d]=iso.split('-');return `${m}/${d}/${y}`}
function linhasCSV(posts){
  const L=[['Subject','Start Date','Start Time','End Date','End Time','All Day Event','Description','Location']];
  posts.filter(p=>p.date).forEach(p=>{
    const col=(acharCol(p.col)||{}).name||'';
    const cat=(acharCat(p.cat)||{}).name||'';
    const tags=(p.tags||[]).map(t=>(acharTag(t)||{}).name).filter(Boolean).join(', ');
    const plats=nomes(p.plats,acharPlat).map(x=>x.name).join(', ')||p.channel||'';
    const forms=nomes(p.forms,acharForm).map(x=>x.name).join(', ');
    const resp=(p.people||[]).map(nome).join(', ');
    const desc=[p.brief,plats&&('Plataformas: '+plats),forms&&('Formato: '+forms),cat&&('Categoria: '+cat),tags&&('Tags: '+tags),resp&&('Responsáveis: '+resp),col&&('Etapa: '+col),p.link&&('Material: '+p.link)].filter(Boolean).join(' | ');
    const pf=(acharPerfil(p.perfil)||{}).name||'';
    const hora=/^\d{1,2}:\d{2}$/.test(p.time||'')?p.time:'';
    L.push([(pf?pf+' · ':'')+(plats?'['+plats+'] ':'')+(p.title||'Post'),usDate(p.date),hora,usDate(p.date),hora,hora?'False':'True',desc,plats]);
  });
  [...S.events.values()].forEach(e=>{
    L.push(['★ '+e.title,usDate(e.date),'',usDate(e.end||e.date),'','True',e.notes||'','']);
  });
  return L.map(r=>r.map(csvEscape).join(',')).join('\r\n');
}
async function exportarCSV(posts){
  const dados=linhasCSV(posts||lista());
  if(!S.downloads){aviso('Exportação indisponível nesta visualização.');return}
  try{
    await S.downloads.save({filename:'vde-agenda-de-conteudo.csv',data:dados});
    aviso('CSV pronto — importe em Google Agenda › Configurações › Importar.');
  }catch(e){
    if(e&&e.code==='declined')return;
    aviso('Não foi possível gerar o arquivo agora.');
  }
}

/* =========================================================
   Boot
   ========================================================= */
function tema(){
  const t=store('tema')||'light';
  document.documentElement.setAttribute('data-theme',t);
}
function ligarChrome(){
  $('#burger').onclick=()=>{$('#sidebar').classList.toggle('open');$('#scrim').classList.toggle('on',$('#sidebar').classList.contains('open'))};
  $('#scrim').onclick=()=>{
    const s=$('#sheetHost .sheet');
    if(s){s.dispatchEvent(new CustomEvent('vde:cancel'));fechaFolha()}
    else{$('#sidebar').classList.remove('open');$('#scrim').classList.remove('on')}
  };
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      const s=$('#sheetHost .sheet');
      if(s){s.dispatchEvent(new CustomEvent('vde:cancel'));fechaFolha()}
      else{$('#sidebar').classList.remove('open');$('#scrim').classList.remove('on')}
    }
  });
  let tq;
  $('#q').oninput=e=>{clearTimeout(tq);tq=setTimeout(()=>{S.filters.q=e.target.value;render()},220)};
  $('#newBtn').onclick=()=>{
    if(S.view==='ideas')abrirIdeia(null);
    else if(S.view==='events')abrirEvento(null);
    else abrirPost(null,{});
  };
  $('#filterBtn').onclick=painelFiltros;
  $('#themeBtn').onclick=()=>{
    const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);store('tema',n);
  };
  $('#exportBtn').onclick=()=>exportarCSV();
}
function pintarQuem(){
  $('#who').innerHTML=`<img src="${esc(S.me.avatarUrl||PH)}" alt=""><div style="min-width:0"><b>${esc(S.me.name||'Você')}</b><div style="font-size:11px">${S.demo?'modo demonstração':S.canWrite?'pode editar':'somente leitura'}</div></div>`;
}
(async function boot(){
  tema();ligarChrome();pintarQuem();render();
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const[db,user,assets,downloads]=await Promise.all([use('db'),use('user'),use('assets'),use('downloads')]);
  S.db=db;S.user=user;S.assets=assets;S.downloads=downloads;
  if(user){
    const me=await user.me();
    S.me={id:me.id,name:me.name,avatarUrl:me.avatarUrl};
    const w=await user.can('data.write');
    S.canWrite=w===null?true:w;
  }
  if(!db){
    S.demo=true;
    bannerTopo('Sem conexão com os dados da equipe nesta visualização — o que você mexer aqui não será salvo.');
  }else{
    const erro=e=>{if(e&&e.code)falhou(e)};
    db.doc('config/board').onSnapshot(s=>{S.board=normBoard(s.exists?s.data():null);render()},erro);
    db.collection('posts').onSnapshot(s=>{
      S.posts=new Map(s.docs.map(d=>[d.id,d.data()]));
      resolverPerfis([...S.posts.values()].flatMap(p=>p.people||[]));
      render();
    },erro);
    db.collection('events').onSnapshot(s=>{S.events=new Map(s.docs.map(d=>[d.id,d.data()]));render()},erro);
    db.collection('ideas').onSnapshot(s=>{S.ideas=new Map(s.docs.map(d=>[d.id,d.data()]));render()},erro);
  }
  S.ready=true;pintarQuem();render();
})();

</script>
